name: discourse_native
description: "Native Discourse client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  discourse_cooking:
    path: packages/discourse_cooking
  discourse_plugin_api:
    path: packages/discourse_plugin_api
  discourse_voice:
    path: packages/discourse_voice
  discourse_video_optimizer:
    path: packages/discourse_video_optimizer
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  mime: ^2.1.0
  intl: ^0.20.3
  timezone: ^0.11.2
  # Kalender's pre-1.0 minor releases can change its API. Upgrade deliberately
  # after checking the post calendar's date ranges and embedded layouts.
  kalender: 0.33.0
  flutter_timezone: ^5.1.1
  device_info_plus: ^13.3.0
  relative_time: ^5.0.0
  shared_preferences: ^2.5.6
  # Linux registers its own preferences store in place of
  # shared_preferences_linux, which rewrites its file in place. See
  # lib/src/data/linux_preferences_store.dart.
  shared_preferences_platform_interface: ^2.4.2
  flutter_web_auth_2: ^5.1.0
  # Depend on the Darwin implementation directly. The umbrella
  # flutter_secure_storage package auto-registers libsecret on Linux even when
  # the app never calls it; Linux uses our mode-0600 XDG file store instead.
  flutter_secure_storage_darwin: ^0.4.3
  ffi: ^2.2.0
  basic_utils: ^5.8.2
  url_launcher: ^6.3.3
  # Native files dragged from Finder/the Linux desktop into the composer.
  # Kept at this boundary: the upload and composer layers consume a small
  # app-owned file abstraction rather than depending on plugin types.
  desktop_drop: ^0.8.4
  # Flutter's clipboard API exposes text only. This keeps native screenshot
  # bytes behind the same app-owned upload boundary as drops and the picker.
  pasteboard: ^0.6.0
  pointycastle: ^4.0.0
  flutter_svg: ^2.3.2
  # AVIF sequences need a native decoder: Flutter's platform fallback exposes
  # only a still frame. Keep transport and caching in our image pipeline.
  flutter_libavif: 0.1.1
  # Parses single-colour icons once so DIcon can tint them while painting;
  # flutter_svg compiles a new picture for every tint.
  vector_graphics_compiler: ^1.3.4
  # Decode server sidebar icons and their references to other sprite symbols.
  xml: ^7.0.1
  flutter_widget_from_html_core: ^0.17.4
  # The YouTube player stays behind our own surface and only exists after the
  # user presses play. This is pinned because every supported platform crosses
  # a native ABI; upgrades need playback and scrolling smoke tests on each one.
  webview_all: 1.4.11
  # Direct imports configure inline/autoplay policy before the native WebView
  # is created. Keep these in lockstep with the umbrella package.
  webview_all_linux: 1.4.11
  webview_all_wkwebview: 1.4.11
  # Uploaded videos use Flutter's standard controller API on its supported
  # native platforms. Linux keeps the existing WebKitGTK media surface because
  # Flutter does not publish a Linux backend; this also keeps the Swift Package
  # Manager Apple graph on the small, official AVFoundation implementation.
  video_player: ^2.14.1
  # Used directly to read onebox markup out of cooked posts; also the DOM
  # flutter_widget_from_html_core hands to its custom builders.
  html: ^0.15.7
  # Parses the generated color-definition stylesheet as CSS rather than with
  # regular expressions. `html` already uses it for selectors; it is direct
  # here because site appearance reads its syntax tree itself.
  csslib: ^1.0.2
  # Syntax highlighting for code blocks. The Dart port of highlight.js, so it
  # knows the same ~190 languages and the same names Discourse writes. Last
  # published in 2021, which is tolerable for a pure-Dart tokenizer with no
  # platform surface. See lib/src/shell/syntax.dart.
  highlight: ^0.7.0
  # The full-screen post-code viewer uses its read-only CodeField so long
  # snippets get native selection, horizontal scrolling, and line gutters.
  # Inline blocks keep the lighter app-owned renderer below.
  flutter_code_editor: ^0.3.5
  # Zoom/pan surface for the post image gallery. `PhotoViewGallery` is the
  # swipe-between-images widget the web client gets from PhotoSwipe, and this is
  # the only pub package that does it well.
  #
  # Last published in 2023, and the repo is quiet — worth knowing before
  # reaching for more of its API. It is confined to lib/src/shell/lightbox.dart
  # for that reason: everything Discourse-shaped (which images are in a gallery,
  # what the caption says) is parsed and drawn here, and photo_view only ever
  # sees an ImageProvider and a page index. Replacing it is a one-file job.
  photo_view: ^0.15.0
  super_sliver_list: ^0.4.1
  # message_bus is the transport every live update on a Discourse rides on, so
  # anything that has to change without being asked — the incoming-topics
  # banner today, presence and post streams later — goes through this. See
  # lib/src/data/site_tracker.dart.
  message_bus_client: ^0.2.1
  # Persistent drafts, private storage and cached media live
  # in platform-appropriate application data directories.
  path_provider: ^2.1.6
  # Native media transports for the always-bundled Voice plugin.
  # Both expose native ABIs and must be upgraded together after exercising Mesh
  # and LiveKit rooms on every supported platform.
  flutter_webrtc: 1.6.3
  livekit_client: 2.13.2
  # Media and topic exports use the platform share sheet.
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  # Keep upload codecs portable across mobile and desktop. Lossy WebP starts
  # in 4.10; encoding runs in a bounded background isolate before upload.
  image: 4.12.0

dependency_overrides:
  # libavif 0.1.1 still declares code_assets v1. Its hook and the resolved
  # native_toolchain_rust support v2, already required by discourse_cooking.
  code_assets: ^2.1.0
  # Reuse parsed default styles within each HTML body. See the bounded cache
  # and exact upstream diff in this reviewed package's PATCHES.md.
  flutter_widget_from_html_core:
    path: packages/flutter_widget_from_html_core
  # Keep every consumer, including livekit_client, on the reviewed local copy
  # with the iOS privacy manifest, track lifecycle, and awaited logging fixes.
  # See packages/discourse_voice/third_party/flutter_webrtc/PATCHES.md.
  flutter_webrtc:
    path: packages/discourse_voice/third_party/flutter_webrtc
  # The current AVFoundation implementation exposes an Apple type that is
  # deprecated only when its Objective-C module is imported by Swift. Keep the
  # warning workaround inside the reviewed package fork instead of weakening
  # the application's warning policy. See
  # packages/video_player_avfoundation/PATCHES.md. The 2.12.3 Swift rewrite
  # still retains the initialization item and starts transform loading before
  # checking disposal; port the metadata lifecycle regressions before upgrading.
  video_player_avfoundation:
    path: packages/video_player_avfoundation

dev_dependencies:
  vm_service: ^15.4.0
  # Parses Dart syntax for the user-facing string localization audit.
  analyzer: ^14.7.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # Exercises platform integration on a real device.
  # Run with: flutter test integration_test \
  #   --test-randomize-ordering-seed=random -d <device>
  integration_test:
    sdk: flutter

  # Exercise native WebView ownership through the real platform boundary.
  webview_platform_interface: 1.4.11

  # Exercise native playback notifications and platform-view rebuilds.
  video_player_platform_interface: 6.9.0
  url_launcher_platform_interface: 2.3.2

  # Gate native calendar export continuations without opening platform UI.
  file_selector_platform_interface: 2.7.0
  image_picker_platform_interface: 2.11.2
  share_plus_platform_interface: 7.2.0

  flutter_lints: ^6.0.0
  path_provider_linux: any
  path_provider_platform_interface: any
  shared_preferences_linux: any
flutter:
  generate: true
  uses-material-design: true
  shaders:
    - packages/discourse_native/src/shell/shaders/forum_texture.frag

name: discourse_native
description: "Native Discourse client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.6.0
  intl: ^0.20.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  relative_time: ^5.0.0
  shared_preferences: ^2.5.5
  flutter_web_auth_2: ^5.0.3
  # Depend on the Darwin implementation directly. The umbrella
  # flutter_secure_storage package auto-registers libsecret on Linux even when
  # the app never calls it; Linux uses our mode-0600 XDG file store instead.
  flutter_secure_storage_darwin: ^0.3.2
  ffi: ^2.2.0
  basic_utils: ^5.8.2
  url_launcher: ^6.3.2
  # Native files dragged from Finder/the Linux desktop into the composer.
  # Kept at this boundary: the upload and composer layers consume a small
  # app-owned file abstraction rather than depending on plugin types.
  desktop_drop: ^0.7.1
  pointycastle: ^4.0.0
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.2
  # Used directly to read onebox markup out of cooked posts; also the DOM
  # flutter_widget_from_html_core hands to its custom builders.
  html: ^0.15.6
  # Parses the generated color-definition stylesheet as CSS rather than with
  # regular expressions. `html` already uses it for selectors; it is direct
  # here because site appearance reads its syntax tree itself.
  csslib: ^1.0.2
  # Syntax highlighting for code blocks. The Dart port of highlight.js, so it
  # knows the same ~190 languages and the same names Discourse writes. Last
  # published in 2021, which is tolerable for a pure-Dart tokenizer with no
  # platform surface. See lib/src/shell/syntax.dart.
  highlight: ^0.7.0
  # Zoom/pan surface for the post image gallery. `PhotoViewGallery` is the
  # swipe-between-images widget the web client gets from PhotoSwipe, and this is
  # the only pub package that does it well.
  #
  # Last published in 2023, and the repo is quiet — worth knowing before
  # reaching for more of its API. It is confined to lib/src/shell/lightbox.dart
  # for that reason: everything Discourse-shaped (which images are in a gallery,
  # what the caption says) is parsed and drawn here, and photo_view only ever
  # sees an ImageProvider and a page index. Replacing it is a one-file job.
  photo_view: ^0.15.0
  super_sliver_list: ^0.4.1
  # message_bus is the transport every live update on a Discourse rides on, so
  # anything that has to change without being asked — the incoming-topics
  # banner today, presence and post streams later — goes through this. Pure
  # Dart, and a git dependency only because it is not on pub.dev yet;
  # pubspec.lock pins the commit. See lib/src/data/site_tracker.dart.
  message_bus_client:
    git:
      url: https://github.com/jjaffeux/dart-message-bus.git
      ref: e58531ff04c855e25da27b266cf83c85cc7db7bf
  # Persistent drafts, private storage, cached media and diagnostics all live
  # in platform-appropriate application data directories.
  path_provider: ^2.1.6
  # Native media transports for the Resenha voice-room plugin. Pinned exactly:
  # both packages expose a native ABI and must be upgraded together after
  # exercising Mesh and LiveKit rooms on every supported platform.
  flutter_webrtc: 1.6.0
  livekit_client: 2.10.0
  # Deep Resenha diagnostics can mirror flutter_webrtc's native log stream
  # into the app-owned, redacted capture store while the user explicitly has
  # capture enabled.
  logger: ^2.7.0
  # LiveKit uses package:logging internally. Diagnostics temporarily raises
  # the root level when hierarchical logging has not been enabled, because
  # package:logging rejects assigning a level to LiveKit's child logger in
  # that mode.
  logging: ^1.3.0
  # Apple platforms expose a native share sheet for a generated diagnostics
  # file. Linux file sharing is not supported by share_plus, so the desktop
  # fallback below lets the user choose a save destination instead.
  # 13.x requires win32 6.x, while the pinned LiveKit SDK currently resolves
  # through device_info_plus on win32 5.x. 12.x exposes the same file-sharing
  # API we use without forcing an unreviewed media SDK upgrade.
  share_plus: ^12.0.2
  file_selector: ^1.1.0

dependency_overrides:
  # Version 1.6.0 lacks the iOS required-reason privacy manifest. Keep every
  # consumer, including livekit_client, on the reviewed local copy.
  flutter_webrtc:
    path: third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the real app on a device, against the real network.
  # Run with: flutter test integration_test -d <device>
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

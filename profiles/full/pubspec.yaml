name: discourse_native_full
description: Full Discourse native application profile, including Resenha.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  discourse_native:
    path: ../..
  discourse_resenha:
    path: ../../packages/discourse_resenha
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

# Overrides from dependencies are deliberately ignored by Dart Pub. Activate
# both reviewed forks explicitly in this application graph.
dependency_overrides:
  flutter_webrtc:
    path: ../../packages/discourse_resenha/third_party/flutter_webrtc
  video_player_avfoundation:
    path: ../../packages/video_player_avfoundation

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

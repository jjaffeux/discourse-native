name: vendor provenance contract

# The provenance check depends on pub.dev availability. Keep it out of ordinary
# PR CI so a transient upstream failure cannot make an unrelated pull request
# red.
on:
  schedule:
    - cron: '47 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Check plugin-owned vendor provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Set up AVIF build tools
        uses: ./.github/actions/setup-avif

      - name: Check vendored package provenance
        run: dart run tool/vendor_provenance_contract.dart

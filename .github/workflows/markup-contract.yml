name: markup contract

# This check depends on discourse/discourse's live main branch. Keep it out of
# ordinary PR CI so upstream changes and transient network failures cannot make
# an otherwise unrelated pull request red.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Check Discourse markup snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Check for upstream markup drift
        run: dart run tool/markup_contract.dart

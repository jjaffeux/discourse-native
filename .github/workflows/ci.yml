name: ci

# The README's Checks section is the gate; this is the gate running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve application and native bridge graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/discourse_resenha && flutter pub get --enforce-lockfile)
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test integration_test tool \
            packages/discourse_resenha/lib \
            packages/discourse_resenha/tool \
            profiles/full/lib

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/discourse_resenha && flutter analyze)
          (cd profiles/full && flutter analyze)

      - name: Test
        run: flutter test --test-randomize-ordering-seed=random

  linux-bundle:
    # Keep the native plugin graph buildable between releases without turning
    # every check into a release/package build.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve root and compatibility package graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Build root and compatibility Linux bundles
        run: |
          flutter build linux --debug
          (cd profiles/full && flutter build linux --debug)

      - name: Smoke-check both always-bundled artifacts
        run: |
          set -euxo pipefail
          core=build/linux/x64/debug/bundle/discourse_native
          full=profiles/full/build/linux/x64/debug/bundle/discourse_native
          test -x "$core"
          test -x "$full"
          core_dependencies="$(ldd "$core")"
          full_dependencies="$(ldd "$full")"
          printf '%s\n' "$core_dependencies"
          printf '%s\n' "$full_dependencies"
          ! grep -q 'not found' <<< "$core_dependencies"
          ! grep -q 'not found' <<< "$full_dependencies"

          # Every application composition includes Resenha and both native
          # media plugins.
          LC_ALL=C grep -aFq 'FlutterWebRTCPlugin' "$core"
          LC_ALL=C grep -aFq 'LiveKitPlugin' "$core"
          LC_ALL=C grep -aFq 'FlutterWebRTCPlugin' "$full"
          LC_ALL=C grep -aFq 'LiveKitPlugin' "$full"

  apple-bundles:
    # Compile both application wrappers on Apple. Each must include the
    # Resenha-owned CallKit bridge and media registrants.
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve root and compatibility package graphs
        run: |
          flutter pub get --enforce-lockfile
          (cd profiles/full && flutter pub get --enforce-lockfile)

      - name: Build root macOS bundle
        # `flutter build macos` has no --no-codesign, and the Xcode project now
        # names the TestFlight team, which the runner has no certificate for.
        # Generate the Xcode configuration, then drive xcodebuild directly with
        # signing disabled — the same arrangement the iOS RunnerTests step uses.
        run: |
          set -euo pipefail
          flutter build macos --debug --config-only
          xcodebuild build \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -derivedDataPath build/macos-core-ci \
            CODE_SIGNING_ALLOWED=NO

      - name: Build root iOS simulator bundle
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build compatibility macOS bundle
        run: |
          set -euo pipefail
          (cd profiles/full && flutter build macos --debug --config-only)
          xcodebuild build \
            -workspace profiles/full/macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -derivedDataPath build/macos-full-ci \
            CODE_SIGNING_ALLOWED=NO

      - name: Build compatibility iOS simulator bundle
        run: |
          cd profiles/full
          flutter build ios --simulator --debug --no-codesign

      - name: Test iOS native coordinator
        run: |
          set -euo pipefail
          destination_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))'
          )"
          test -n "$destination_id"
          xcodebuild test \
            -workspace profiles/full/ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -only-testing:RunnerTests \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      - name: Smoke-check native bundles
        run: |
          set -euo pipefail
          test -x build/macos-core-ci/Build/Products/Debug/Discourse.app/Contents/MacOS/Discourse
          test -x build/macos-full-ci/Build/Products/Debug/Discourse.app/Contents/MacOS/Discourse
          test -d build/ios/iphonesimulator/Runner.app
          test -d profiles/full/build/ios/iphonesimulator/Runner.app

          # The package-owned channel is compiled into every app.
          LC_ALL=C grep -aRqsF 'org.discourse.native/resenha_callkit' \
            build/ios/iphonesimulator/Runner.app
          LC_ALL=C grep -aRqsF 'org.discourse.native/resenha_callkit' \
            profiles/full/build/ios/iphonesimulator/Runner.app

name: ci

# The README's Checks section is the gate; this is the gate running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  linux-bundle:
    # Keep the native plugin graph buildable between releases without turning
    # every check into a release/package build.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux bundle
        run: flutter build linux --debug

      - name: Smoke-check the bundle
        working-directory: build/linux/x64/debug/bundle
        run: |
          set -euo pipefail
          test -x discourse_native
          dependencies="$(ldd discourse_native)"
          printf '%s\n' "$dependencies"
          if grep -q 'not found' <<< "$dependencies"; then
            exit 1
          fi

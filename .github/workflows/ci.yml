name: ci

# The README's Checks section is the gate; this is the gate running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Same pin as release.yml, so what passes here builds there.
  FLUTTER_VERSION: 3.44.8

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

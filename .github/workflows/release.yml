name: release

# Builds a .deb and publishes it to an apt repository on GitHub Pages. Users
# install with `apt install discourse-native` and update with `apt upgrade`;
# nothing updates itself. See docs/release-runbook.md.
#
# Stable is a tag. Canary is deliberately NOT every push to main: apt requires
# the .deb to sit at the same origin as its metadata, so every build is ~14MB
# added to gh-pages permanently, and git history keeps it even after the pool
# is pruned. Canary is published on demand instead.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        type: choice
        options: [canary, stable]
        default: canary

permissions:
  contents: write

# Two channels never write the same index file, but two canaries can. Serialise
# per channel so the gh-pages merge cannot lose an entry.
concurrency:
  # Two runs on the same channel would race the same apt suite. inputs.channel
  # is what a dispatch picks; a tag is always stable.
  group: release-${{ github.ref_type == 'tag' && 'stable' || inputs.channel || 'canary' }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8
  APP_NAME: Discourse
  # The Debian package name, and so the command users type. Distinct from
  # PACKAGE_ID, which is the GTK application id and the libsecret schema, and
  # from BINARY_NAME, which is what the Flutter build emits.
  PKG: discourse-native
  PACKAGE_ID: org.discourse.native
  BINARY_NAME: discourse_native
  PAGES_BRANCH: gh-pages
  FEED_BASE: https://jjaffeux.github.io/discourse-native

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Container jobs default to `sh -e {0}`, not bash, and dash has no
    # pipefail -- so every `set -euo pipefail` below dies on the set line
    # before running anything. Named here once rather than per step.
    defaults:
      run:
        shell: bash
    # Built against Ubuntu 22.04's glibc 2.35 so the binary also runs on Debian
    # 12 and Ubuntu 22.04. Deliberately decoupled from the runner image, which
    # GitHub rotates on its own schedule.
    container:
      image: ubuntu:22.04

    steps:
      # Must be first. The container is bare, and actions/checkout silently
      # degrades to a tarball download without git -- which would leave
      # `git rev-list --count` with no history and make build numbers garbage.
      - name: Container prerequisites
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip file sudo jq \
            apt-utils gnupg dpkg-dev

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout, the Flutter SDK and pub's git-dependency clones are all
      # owned by a different uid than the one these steps run as, so git refuses
      # each of them as "dubious ownership" and anything shelling out to git
      # fails with exit 128.
      #
      # A wildcard rather than three paths: the SDK's location is the action's
      # to change, and pub clones message_bus_client somewhere under PUB_CACHE
      # that is not ours to predict. Naming them individually is whack-a-mole,
      # and this container is ephemeral, single-purpose, and running as root
      # over a tree we just checked out ourselves.
      - name: Trust the checkouts
        run: git config --global --add safe.directory '*'

      - name: Build dependencies
        run: |
          set -eux
          apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev \
            libssl-dev
          # Fail here rather than 200 lines into a cmake log.
          #
          # libcrypto is desktop_updater's: its native component does
          # find_package(OpenSSL REQUIRED COMPONENTS Crypto) to hash the
          # artifact it stages. Its CURL dependency is gated behind
          # DESKTOP_UPDATER_NATIVE_RUNTIME, which defaults off, so that one is
          # not needed here.
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 libsecret-1 \
                              libcrypto

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # The SDK cache is fine; the pub one is not. Its post step evaluates
          # hashFiles('**/pubspec.lock') on the host, where the checkout is not
          # visible at the path it looks under, because the job runs in a
          # container. That fails the post step and so marks an otherwise
          # perfect run red -- which is worse than a slower `pub get`, since it
          # means a real failure no longer stands out.
          pub-cache: false

      - name: Resolve channel and version
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            CHANNEL=stable
          else
            CHANNEL="${{ inputs.channel || 'canary' }}"
          fi

          BASE=$(grep -m1 '^version:' pubspec.yaml \
                 | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUILD=$(git rev-list --count HEAD)

          if [ "$CHANNEL" = stable ]; then
            TAG="${GITHUB_REF_NAME}"
            # The tag and the pubspec disagreeing means one of them is a
            # mistake, and shipping either is worse than failing here.
            if [ "${TAG#v}" != "$BASE" ]; then
              echo "::error::tag $TAG does not match pubspec version $BASE"
              exit 1
            fi
            VERSION="$BASE"
            PRERELEASE=false
          else
            # Semver orders 1.3.0-canary.412 < 1.3.0, so canary always sorts
            # above the last stable and strictly below the next one.
            VERSION="${BASE}-canary.${BUILD}"
            TAG="v${VERSION}"
            PRERELEASE=true
          fi

          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # A broken canary that installs itself is worse than no canary.
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build
        run: |
          set -eux
          flutter build linux --release \
            --build-name "${{ steps.v.outputs.version }}" \
            --build-number "${{ steps.v.outputs.build }}" \
            --dart-define=DISCOURSE_NATIVE_VERSION=${{ steps.v.outputs.version }} \
            --dart-define=DISCOURSE_NATIVE_CHANNEL=${{ steps.v.outputs.channel }} \
            --dart-define=DISCOURSE_NATIVE_FEED_URL=${{ env.FEED_BASE }}

      - name: Check the bundle
        working-directory: build/linux/x64/release/bundle
        run: |
          set -eux
          test -x "${{ env.BINARY_NAME }}"
          test -x install-desktop-entry.sh
          test -f "data/desktop/${{ env.PACKAGE_ID }}.desktop"
          test -d data/desktop/icons/hicolor/scalable/apps
          # Catches a dependency change silently dropping onto the 4.0/libsoup2
          # branch, which aborts at runtime rather than at build time.
          ldd "${{ env.BINARY_NAME }}" | grep -q libwebkit2gtk-4.1

      - name: Build the .deb
        id: deb
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"

          # Debian version ordering, which is not semver's. A tilde sorts
          # BEFORE the version it precedes, so 1.0.0~canary23 < 1.0.0 and a
          # canary user moves onto stable when it lands. Semver's hyphen does
          # the opposite here: dpkg reads 1.0.0-canary23 as Debian revision
          # "canary23" of 1.0.0, which sorts AFTER plain 1.0.0 and would strand
          # canary users above every future stable release.
          DEB_V="${V/-canary./~canary}"
          ROOT="$RUNNER_TEMP/deb"
          APP="$ROOT/usr/lib/${{ env.PKG }}"

          mkdir -p "$APP" "$ROOT/usr/bin" "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons" "$ROOT/DEBIAN"

          cp -r build/linux/x64/release/bundle/. "$APP/"

          # Scaffolding for the relocatable archive, which a package does not
          # want: dpkg owns the launcher and the icon tree, and Exec= is a
          # known path rather than something a script has to discover.
          rm -f "$APP/install-desktop-entry.sh"
          rm -rf "$APP/data/desktop"

          ln -s "../lib/${{ env.PKG }}/${{ env.BINARY_NAME }}" \
                "$ROOT/usr/bin/${{ env.PKG }}"

          sed "s|^Exec=@EXEC@$|Exec=/usr/bin/${{ env.PKG }}|" \
            "linux/packaging/${{ env.PACKAGE_ID }}.desktop" \
            > "$ROOT/usr/share/applications/${{ env.PACKAGE_ID }}.desktop"
          grep -q '^Exec=/usr/bin/' \
            "$ROOT/usr/share/applications/${{ env.PACKAGE_ID }}.desktop"

          cp -r linux/icons/hicolor "$ROOT/usr/share/icons/"

          # Hand-written rather than derived by dpkg-shlibdeps, which wants a
          # debian/ source tree to run in. Asserted below by asking apt to
          # resolve them, which is what catches a name that does not exist.
          #
          # gnome-keyring is Recommends, not Depends: the app needs *a* Secret
          # Service or it forgets your account, but KWallet's bridge serves
          # just as well and a KDE user should not be made to install GNOME's.
          # printf rather than a heredoc: a heredoc's terminator has to sit at
          # column 0, and every line inside a YAML block scalar is indented, so
          # the delimiter would never match and the script would run on to the
          # end of the file.
          #
          # The leading space on the last line is Debian's continuation marker
          # for a multi-line Description, not a typo.
          printf '%s\n' \
            "Package: ${{ env.PKG }}" \
            "Version: $DEB_V" \
            "Architecture: amd64" \
            "Maintainer: Joffrey Jaffeux <j.jaffeux@gmail.com>" \
            "Section: net" \
            "Priority: optional" \
            "Homepage: https://github.com/${{ github.repository }}" \
            "Depends: libgtk-3-0, libglib2.0-0, libwebkit2gtk-4.1-0, libsoup-3.0-0, libsecret-1-0, libssl3" \
            "Recommends: gnome-keyring" \
            "Description: Native Discourse client" \
            " An experimental native client for Discourse forums, built with Flutter." \
            > "$ROOT/DEBIAN/control"

          DEB="$RUNNER_TEMP/${{ env.PKG }}_${DEB_V}_amd64.deb"
          dpkg-deb --build --root-owner-group "$ROOT" "$DEB"

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "debver=$DEB_V" >> "$GITHUB_OUTPUT"

      - name: Check the .deb
        run: |
          set -euo pipefail
          DEB="${{ steps.deb.outputs.deb }}"
          dpkg-deb --info "$DEB"

          # The executable bit has to survive into the archive, and the symlink
          # has to stay a symlink rather than becoming a copy.
          dpkg-deb -c "$DEB" | grep -E '^-rwxr-xr-x.*/usr/lib/${{ env.PKG }}/${{ env.BINARY_NAME }}$'
          dpkg-deb -c "$DEB" | grep -E '^lrwxrwxrwx.*/usr/bin/${{ env.PKG }} ->'

          # Ask apt to resolve Depends without installing anything. This is
          # what catches a package name that does not exist -- the failure mode
          # of writing them by hand -- and it fails here rather than on a
          # user's machine.
          apt-get install --simulate --no-install-recommends "$DEB" > /dev/null
          echo "dependencies resolve"

      - name: Import the repository signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${APT_GPG_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is not set; see docs/release-runbook.md"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_KEY" | base64 -d | gpg --batch --import

          # Written to a file rather than passed on the signing command line.
          # An argument is visible in the process listing, and splicing the
          # secret into the script text would be an injection surface as well.
          umask 077
          printf '%s' "$APT_GPG_PASSPHRASE" > "$GNUPGHOME/pass"

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Publish to the apt repository
        run: |
          set -euo pipefail
          CH="${{ steps.v.outputs.channel }}"
          P="$RUNNER_TEMP/pages"

          git clone --depth 1 --branch "${{ env.PAGES_BRANCH }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$P"

          # One self-contained repository per channel rather than one repo with
          # two suites sharing a pool. apt-ftparchive scans a directory tree, so
          # a shared pool would list canary packages in stable's Packages file
          # unless every suite carried a hand-maintained file list.
          R="$P/apt/$CH"
          POOL="$R/pool/main/d/${{ env.PKG }}"
          mkdir -p "$POOL" "$R/dists/$CH/main/binary-amd64"
          cp "${{ steps.deb.outputs.deb }}" "$POOL/"

          # apt needs the .deb at the same origin as its metadata -- Filename:
          # is repo-relative and cannot point at Releases -- so the pool grows
          # inside gh-pages. Keep the last few and let apt offer only those.
          # Note git history still holds the pruned ones; if the branch ever
          # gets heavy, re-create it as an orphan.
          ls -1 "$POOL"/*.deb | sort -V | head -n -3 | xargs -r rm -v

          cd "$R"
          # The previous run's signatures are still here from the clone, and
          # `apt-ftparchive release` hashes everything it finds under the suite
          # -- including them -- so a stale InRelease would end up listed in the
          # Release it is supposed to sign.
          rm -f "dists/$CH/InRelease" "dists/$CH/Release" "dists/$CH/Release.gpg"

          apt-ftparchive --arch amd64 packages pool > "dists/$CH/main/binary-amd64/Packages"
          gzip -9cn "dists/$CH/main/binary-amd64/Packages" \
            > "dists/$CH/main/binary-amd64/Packages.gz"

          apt-ftparchive \
            -o "APT::FTPArchive::Release::Origin=discourse-native" \
            -o "APT::FTPArchive::Release::Label=discourse-native" \
            -o "APT::FTPArchive::Release::Suite=$CH" \
            -o "APT::FTPArchive::Release::Codename=$CH" \
            -o "APT::FTPArchive::Release::Architectures=amd64" \
            -o "APT::FTPArchive::Release::Components=main" \
            release "dists/$CH" > "dists/$CH/Release"

          # InRelease is the inline-signed form apt prefers; Release.gpg is the
          # detached one older clients still ask for.
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$GNUPGHOME/pass" \
              --clearsign -o "dists/$CH/InRelease" "dists/$CH/Release"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$GNUPGHOME/pass" \
              -abs -o "dists/$CH/Release.gpg" "dists/$CH/Release"

          # The key users pin with signed-by=. Public material.
          gpg --armor --export > "$P/key.asc"

          cd "$P"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "$CH: ${{ steps.deb.outputs.debver }} (${{ github.sha }})"
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      # A direct download for anyone who will not add a repository, which is
      # the fallback the reference install docs offer too.
      - name: Publish the .deb on Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_NAME }} ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.deb.outputs.deb }}

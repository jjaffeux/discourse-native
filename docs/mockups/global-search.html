function showNotes(){dialog('About this mockup',`<p>A single interactive proposal for global search in Discourse Native. The header input and <strong>${isMac?'⌘F':'Ctrl+F'}</strong> open a large desktop popover. Opening search replaces the navbar field with the same input inside the popover at the same coordinates. Closing it restores the navbar field. Mouse-driven desktop windows keep this behavior at narrow widths; touch phone layouts keep a full-page search. Escape returns to the previous content, and opening a result preserves your search.</p><h3>Native components</h3><p>This HTML translates the project’s Native UI kit; it does not run Flutter widgets. Implementation uses <code>package:discourse_native/discourse_ui.dart</code>.</p><table><thead><tr><th>Interface</th><th>Existing kit composition</th></tr></thead><tbody><tr><td>Search and scope</td><td>DPopover, DPopoverAnchor, DInputGroup, DInput, DKbd, DToggleGroup</td></tr><tr><td>Filter menu and values</td><td>DPopover + DCommand, DDropdownMenuSub, DCombobox, DCheckbox, DSelect, DDatePicker</td></tr><tr><td>Condition chips</td><td>DButtonGroup with label, condition, value and remove controls</td></tr><tr><td>Ordering and results</td><td>DSelect, DSwitch, DItem, DBadge, DAvatar</td></tr><tr><td>Loading and empty states</td><td>DSkeleton, DEmpty, DAlert</td></tr></tbody></table><p style="margin-top:14px"><strong>No new kit primitive is required.</strong> The search condition is a new application composition of existing controls. The mockup uses Meta’s saved palette, Native’s 8px radius, and 32 / 28 / 24px control sizes.</p><h3>What you can try</h3><p>Search all four content types, browse recent searches, add and edit condition chips, combine date or count bounds, change ordering and display properties, open results, and return without losing context. Type search operators and press Enter to turn them into chips.</p><p>Type-specific filters switch to their matching search type. Each type keeps its conditions while you switch tabs; All searches broadly. Chat disappears when chat search is disabled. Prototype settings let you try plugins, permissions, directory fallbacks, loading, and connection errors.</p><button class="d-button" data-action="settings">${icon('sliders')}Prototype settings</button><h3>API boundaries</h3><p>Forum search uses the full search API. Users and groups use their directory endpoints; a disabled directory falls back to basic aggregate search. Chat uses its separate search endpoint. There is no universal OR builder, chat date filter, user trust-level filter, or core AI filter.</p><p>The sample evaluator covers the represented filters and sorts. It is not Discourse’s full-text ranking engine. All content is local: no site requests, credentials, or account changes. Category descendants, tag groups, badge IDs, and additional site-defined directory columns need real site metadata in implementation.</p><h3>Current request mapping</h3><pre>${esc(queryPlan().join('\n\n'))}</pre><p>Aggregate production search combines Discourse’s header results with chat. Dedicated tabs paginate independently. Forum results normally group by topic; “Every matching post” removes that grouping.</p><h3>Sources checked</h3><p><a href="https://github.com/discourse/discourse/blob/main/lib/search.rb" target="_blank" rel="noreferrer">Core search operators</a> · <a href="https://github.com/discourse/discourse/blob/main/app/controllers/search_controller.rb" target="_blank" rel="noreferrer">Search endpoints</a> · <a href="https://github.com/discourse/discourse/blob/main/app/controllers/directory_items_controller.rb" target="_blank" rel="noreferrer">User directory</a> · <a href="https://github.com/discourse/discourse/blob/main/app/controllers/groups_controller.rb" target="_blank" rel="noreferrer">Groups</a> · <a href="https://github.com/discourse/discourse/blob/main/plugins/chat/app/services/chat/search_message.rb" target="_blank" rel="noreferrer">Chat search</a></p><p style="font-size:12px">Verified September 13, 2026. Optional plugin filters include Solved, Assign, Poll, and Topic Voting; additional installed plugins may extend search.</p>`)}
function parseExpression(input,{replace=false}={}){if(['users','groups'].includes(S.scope)){S.q=input.trim();$('search-input').value=S.q;render();return true}const parts=input.match(/(?:[^\s"]+|"[^"]*")+/g)||[];const plain=[],found=[],errors=[];let target=S.scope==='chat'?'chat':'forum',sort=null;
for(let token of parts){if(/^".*"$/.test(token)){plain.push(token);continue}let matched=false;const raw=token;token=({l:'order:latest',r:'order:read',f:'in:first',t:'in:title','in:messages':'in:personal','in:mine':'in:created','in:whispers':'in:whisper','in:bots':'in:bot','in:humans':'in:human','include:invisible':'include:unlisted'}[token]||token).replace(/^min_post_count:/,'min_posts:').replace(/^filetype:/,'filetypes:');if(token.startsWith('order:')){const value=token.slice(6);if((target==='chat'?ORDERING.chat:ORDERING.forum).some(o=>o[0]===value)||value==='votes'&&S.settings.voting)sort=value;else errors.push('Unsupported ordering: '+value);continue}
for(const d of FILTERS.filter(d=>canDef(d)&&d.scope===target)){const c=d.choices?.find(c=>c.token===token);if(c){found.push({id:d.id,op:d.ops?.[0]?.value||'is',value:c.value});matched=true;break}}
if(matched)continue;
if(token.startsWith('@')){found.push({id:target==='chat'?'chatAuthor':'author',op:'is',value:token.slice(1)});continue}
if(token.startsWith('#')){const value=token.slice(1);found.push({id:target==='chat'?'chatChannel':'hashtag',op:'is',value});continue}
if(!token.includes(':')){plain.push(token);continue}
let key=token.slice(0,token.indexOf(':')),value=token.slice(token.indexOf(':')+1).replace(/^"|"$/g,'');if(target==='chat'){errors.push('Chat supports @person and #channel; use the menu for thread replies.');continue}if(key==='user'){found.push({id:'author',op:'is',value});continue}if(key==='created'&&value.startsWith('@')){found.push({id:'topicAuthor',op:'is',value:value.slice(1)});continue}
if(['category','categories'].includes(key)){found.push({id:'category',op:value.startsWith('=')?'exactCategory':'any',value:value.split(',').map(v=>v.replace(/^=/,''))});continue}if(['tag','tags','-tag','-tags'].includes(key)){found.push({id:'tags',op:key.startsWith('-')?(value.includes('+')?'notAll':'none'):(value.includes('+')?'all':'any'),value:value.split(/[,+]/)});continue}
for(const d of FILTERS.filter(d=>canDef(d)&&d.scope==='forum'&&!['choice','multi'].includes(d.kind))){const op=Object.entries(d.opTokens||{}).find(([,v])=>v===key)?.[0];if(op||d.token===key){if(d.kind==='date'){if(/^\d{1,3}$/.test(value)){const date=new Date(NOW);date.setUTCDate(date.getUTCDate()-+value);value=date.toISOString().slice(0,10)}if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){errors.push('Use an ISO date (YYYY-MM-DD) or relative days in this prototype.');matched=true;break}}if(d.kind==='number'&&!/^\d+$/.test(value)){errors.push('Use a whole number for '+d.label.toLowerCase()+'.');matched=true;break}found.push({id:d.id,op:op||d.ops?.[0]?.value||'is',value});matched=true;break}}
if(!matched)errors.push('Unknown or unavailable operator: '+raw)
}
for(const f of found){const d=defFor(f.id);if(!canDef(d))errors.push('This filter is unavailable.');else{const message=filterError(d,f);if(message)errors.push(d.label+': '+message)}}if(errors.length){S.rawError=errors.join(' ');renderFilters();return false}if(replace){S.filters[target]=[];S.sort[target]=defaults[target]}if(found.length||sort){S.scope=target;for(const f of found){const same=activeFilters(target).findIndex(x=>x.id===f.id&&x.op===f.op&&JSON.stringify(x.value)===JSON.stringify(f.value));if(same<0)S.filters[target].push(f)}if(sort)S.sort[target]=sort}S.q=plain.join(' ');S.rawError='';$('search-input').value=S.q;S.page=1;render();saveHistory();return true}
function applySetting(key,value){if(key==='dark'){document.documentElement.dataset.theme=value?'dark':'light';return}S.settings[key]=value;if(key==='staff'&&!value)S.settings.admin=false;if(key==='admin'&&value)S.settings.staff=true;for(const scope of Object.keys(S.filters))S.filters[scope]=S.filters[scope].filter(f=>canDef(defFor(f.id)));if(!S.settings.chat&&S.scope==='chat')S.scope='all';if(!S.settings.voting&&S.sort.forum==='votes')S.sort.forum='relevance';if(!directoryAvailable('users'))S.sort.users='username';if(!directoryAvailable('groups')||!canOrderGroupsByMembers())S.sort.groups='name';render();if($('dialog').open)showSettings()}
function handleAction(action,el){switch(action){case'search':showSearch();break;case'home':closePopups(false);showHome();break;case'nav-users':showSearch({focus:false,restore:true});setScope('users',{focus:true});break;case'nav-groups':showSearch({focus:false,restore:true});setScope('groups',{focus:true});break;case'close-search':leaveSearch();break;case'back-results':showSearch({restore:true});break;case'clear-query':setQuery('');$('search-input').focus();break;case'reset-search':S.filters[S.scope]=[];S.sort[S.scope]=defaults[S.scope];setQuery('');$('search-input').focus();break;case'clear-filters':if(S.scope!=='all')S.filters[S.scope]=[];S.sort[S.scope]=defaults[S.scope];render();break;case'reset-sort':S.sort[S.scope]=defaults[S.scope];render();break;case'filters':S.popup==='filters'?closePopups():openFilters(el);break;case'display':S.popup==='display'?closePopups():openDisplay();break;case'back-filter-menu':$('filter-submenu').hidden=true;S.editing=null;S.editIndex=null;S.draft=null;renderFilterList();$('filter-search').focus();break;case'apply-filter':applyFilter();break;case'clear-history':recent=[];try{localStorage.setItem('native-global-search-history-v1','[]')}catch{}render();break;case'more':S.page++;render();break;case'syntax':showSyntax();break;case'notes':showNotes();break;case'settings':showSettings();break;case'appearance':applySetting('dark',document.documentElement.dataset.theme!=='dark');break;case'close-dialog':$('dialog').close();break;case'apply-syntax':if(parseExpression($('syntax-query').value,{replace:true})){$('dialog').close();showSearch({restore:true})}else{$('syntax-error').hidden=false;$('syntax-error').textContent=S.rawError}break;case'copy-query':{const value=$('syntax-query').value;if(navigator.clipboard)navigator.clipboard.writeText(value).then(()=>notify('Query copied.')).catch(()=>{$('syntax-query').select();notify('Select and copy the query.');});else{$('syntax-query').select();notify('Select and copy the query.')}break}case'demo-loading':$('dialog').close();showSearch({restore:true});S.error=false;S.loading=true;render();setTimeout(()=>{S.loading=false;if(!S.q)setQuery('search');else render()},1500);break;case'demo-error':$('dialog').close();showSearch({restore:true});S.error=true;render();break;case'retry':S.error=false;S.loading=true;render();setTimeout(()=>{S.loading=false;render()},450);break;case'demo-empty':$('dialog').close();showSearch({restore:true});setQuery('a phrase with no matching results');break;case'reset-demo':$('dialog').close();Object.assign(S.settings,{chat:true,solved:true,assign:true,poll:true,voting:false,staff:false,admin:false,userDirectory:true,groupDirectory:true});S.asc={users:true,groups:true};document.documentElement.dataset.theme='dark';recent=[{q:'keyboard',scope:'all',filters:[]},{q:'search',scope:'forum',filters:[]},{q:'clara',scope:'all',filters:[]}];try{localStorage.setItem('native-global-search-history-v1',JSON.stringify(recent))}catch{}S.scope='all';for(const k of Object.keys(S.filters))S.filters[k]=[];Object.assign(S.sort,defaults);S.error=false;S.loading=false;S.compact=false;Object.keys(S.props).forEach(k=>S.props[k]=true);setQuery('');showSearch();break}}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(el){if(el.dataset.action)handleAction(el.dataset.action,el);else if(el.dataset.scope)setScope(el.dataset.scope);else if(el.dataset.result){const d=DATA.find(d=>d.id===el.dataset.result);if(d)openResult(d)}else if(el.dataset.filter)openFilter(el.dataset.filter,el);else if(el.dataset.editFilter){const [id,index]=el.dataset.editFilter.split('|');openFilter(id,el,+index)}else if(el.dataset.removeFilter!==undefined){const index=+el.dataset.removeFilter;activeFilters().splice(index,1);render()}else if(el.dataset.filterValue!==undefined){const d=defFor(S.editing);if(d.kind==='multi'){const value=el.dataset.filterValue;S.draft.value=has(S.draft.value,value)?S.draft.value.filter(v=>v!==value):[...S.draft.value,value]}else S.draft.value=el.dataset.filterValue;const op=$('condition-op')?.value;if(op)S.draft.op=op;const custom=$('custom-values')?.value;renderSubmenu();if(custom&&$('custom-values'))$('custom-values').value=custom;setMenuPosition();$('filter-submenu').querySelector(`[data-filter-value="${CSS.escape(el.dataset.filterValue)}"]`)?.focus()}else if(el.dataset.prop){S.props[el.dataset.prop]=!S.props[el.dataset.prop];render();renderDisplay();$('display-menu').querySelector(`[data-prop="${el.dataset.prop}"]`)?.focus()}else if(el.dataset.recent!==undefined){const r=recent[+el.dataset.recent];S.scope=r.scope==='chat'&&!S.settings.chat?'all':r.scope;if(S.scope!=='all')S.filters[S.scope]=structuredClone(r.filters).filter(f=>defFor(f.id)&&canDef(defFor(f.id)));setQuery(r.q);$('search-input').focus()}else if(el.dataset.syntaxExample){$('syntax-query').value=el.dataset.syntaxExample;if(['groups','users'].includes(S.scope))S.scope='all'}else if(el.dataset.category){showSearch({focus:false,restore:true});S.scope='forum';S.filters.forum=[{id:'category',op:'any',value:[el.dataset.category]}];setQuery('')}else if(el.dataset.channel){showSearch({focus:false,restore:true});S.scope='chat';S.filters.chat=[{id:'chatChannel',op:'is',value:el.dataset.channel}];setQuery('')}}});
document.addEventListener('pointerdown',e=>{if(S.popup&&!e.target.closest('.popover,#filter-trigger,#display-trigger,[data-action=filters],[data-action=display],[data-edit-filter]'))closePopups(false)});

function moveResult(delta){if(!visibleResults.length)return;S.selected=(S.selected+delta+visibleResults.length)%visibleResults.length;document.querySelectorAll('.result-row').forEach(x=>x.classList.remove('keyboard-active'));const target=$('results').querySelector(`[data-result="${visibleResults[S.selected].id}"]`);target?.classList.add('keyboard-active');target?.focus();target?.scrollIntoView({block:'nearest'})}
document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();if($('dialog').open)$('dialog').close();closePopups(false);showSearch();return}if(e.key==='Escape'){if($('dialog').open)return;e.preventDefault();if(!$('filter-submenu').hidden){handleAction('back-filter-menu');return}if(S.popup){closePopups();return}if(S.screen==='detail'){showSearch({restore:true});return}if(S.screen==='search')leaveSearch();return}if($('dialog').open)return;
if(S.popup){if(e.key==='Enter'&&e.target.id==='condition-value'){e.preventDefault();applyFilter();return}if(['ArrowDown','ArrowUp'].includes(e.key)&&e.target.tagName!=='SELECT'){e.preventDefault();const parent=!$('filter-submenu').hidden?$('filter-submenu'):S.popup==='filters'?$('filter-menu'):$('display-menu');const items=[...parent.querySelectorAll('button:not(:disabled),select,input:not([type=checkbox])')];const i=items.indexOf(document.activeElement),next=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus();return}if(e.key==='ArrowRight'&&e.target.dataset.filter){e.preventDefault();openFilter(e.target.dataset.filter,e.target);return}if(e.key==='ArrowLeft'&&!$('filter-submenu').hidden&&!editing){e.preventDefault();handleAction('back-filter-menu');return}return}

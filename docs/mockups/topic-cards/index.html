<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Card mode studies — Discourse Native</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="cards.css">
</head>
<body>
<header class="studio">
  <div class="studio-heading"><span class="eyebrow">DISCOURSE NATIVE / DESIGN STUDY</span><h1>Give topics a place of their own.</h1></div>
  <nav class="directions" aria-label="Card design directions">
    <a href="?design=framed" data-design-choice="framed"><span>A</span> Framed rows</a>
    <a href="?design=conversation" data-design-choice="conversation"><span>B</span> Conversation cards</a>
    <a href="?design=grid" data-design-choice="grid"><span>C</span> Card grid</a>
  </nav>
  <p id="design-description"></p>
</header>
<main class="stage">
  <section class="frame" id="frame" aria-label="Topic list design">
    <section class="list-pane" aria-label="Topics">
      <header class="topbar" id="topbar"></header>
      <div class="toolbar" id="toolbar"></div>
      <div class="contextbar" id="contextbar"></div>
      <div class="feed-status" id="feed-status" aria-live="polite"></div>
      <div class="table-shell" id="table-shell">
        <div class="columns" id="columns"></div>
        <div class="list-scroll" id="list-scroll" aria-label="Topic list" tabindex="0"></div>
      </div>
      <footer class="footer" id="footer"></footer>
    </section>
    <aside class="reader" id="reader" aria-label="Topic preview"></aside>
  </section>
  <div class="study" aria-label="Mockup preview controls">
    <span class="brand">CARD MODE <span style="color:var(--muted)">/ INTERACTIVE STUDY</span></span>
    <span class="study-divider">·</span>
    <label>Preview <select id="scene-select" aria-label="Preview context">
      <option value="topics">All topics</option><option value="category">Category & subcategory</option><option value="messages">Personal messages</option><option value="group">Group inbox</option><option value="aggregate">Across forums</option><option value="assigned">Group assignments</option><option value="guest">Signed out</option>
    </select></label>
    <label>State <select id="state-select" aria-label="Preview state">
      <option value="ready">Ready</option><option value="incoming">Incoming topics</option><option value="loading">Initial loading</option><option value="empty">Empty list</option><option value="caught">All caught up</option><option value="noresults">No search results</option><option value="error">Initial error</option><option value="refresh-error">Refresh error</option><option value="loading-more">Loading next page</option><option value="page-error">Next-page error</option><option value="end">End of list</option>
    </select></label>
    <button class="plain-button theme-button" id="theme-toggle" data-action="theme" aria-label="Switch to light theme"></button>
    <button class="plain-button" id="width-toggle" data-action="width" aria-pressed="false"></button>
    <button class="plain-button coverage-button" data-action="coverage">Feature map <span aria-hidden="true">↗</span></button>
  </div>
</main>
<div class="popover" id="popover" popover="auto" role="dialog" aria-label="Options"></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="base.js"></script>
<script src="cards.js"></script>
</body>
</html>

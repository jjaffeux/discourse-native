(() =&gt; {
  const root = document.getElementById(&#x27;topic-header-motion&#x27;);

  const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);

  const postData = [
    [&#x27;A&#x27;, &#x27;Alex&#x27;, &#x27;2h ago&#x27;, &#x27;&lt;p&gt;Sharing the support coverage plan for our week in Seville. Let’s make sure there’s always someone available while the rest of the team is at the meetup.&lt;/p&gt;&lt;p&gt;Please add your availability below. We’ll use this topic to coordinate handovers and keep everyone up to date.&lt;/p&gt;&#x27;],
    [&#x27;M&#x27;, &#x27;Maya&#x27;, &#x27;1h ago&#x27;, &#x27;&lt;p&gt;I can cover the morning queue on Monday and Tuesday.&lt;/p&gt;&lt;div class=&quot;th-quote&quot;&gt;Let’s make sure there’s always someone available while the rest of the team is at the meetup.&lt;/div&gt;&lt;p&gt;I’ll leave handover notes here before heading out. &lt;span class=&quot;th-post-link&quot;&gt;@sam&lt;/span&gt;, would the afternoon work for you?&lt;/p&gt;&#x27;],
    [&#x27;S&#x27;, &#x27;Sam&#x27;, &#x27;1h ago&#x27;, &#x27;&lt;p&gt;Tuesday afternoon works for me. I can also take the late shift on Wednesday if that helps.&lt;/p&gt;&lt;p&gt;It would be good to keep a little overlap between shifts so nothing falls through the cracks.&lt;/p&gt;&#x27;],
    [&#x27;A&#x27;, &#x27;Alex&#x27;, &#x27;48m ago&#x27;, &#x27;&lt;p&gt;That works. Let’s keep a 30-minute handover between each shift and collect anything that needs a follow-up in this topic.&lt;/p&gt;&#x27;],
    [&#x27;M&#x27;, &#x27;Maya&#x27;, &#x27;35m ago&#x27;, &#x27;&lt;p&gt;Added my availability. I’ll check the queue before the morning sessions and post an update if anything urgent comes in.&lt;/p&gt;&#x27;],

  root.querySelectorAll(&#x27;.th-study&#x27;).forEach(study =&gt; {
    const stage = study.querySelector(&#x27;.th-window&#x27;);
    const option = study.dataset.option;
    stage.innerHTML = `
      &lt;div class=&quot;th-scroll&quot; role=&quot;region&quot; aria-label=&quot;Scrollable example topic for option ${option}&quot;&gt;

        &lt;div class=&quot;th-end&quot;&gt;You’re all caught up&lt;/div&gt;
      &lt;/div&gt;
      &lt;header class=&quot;th-header&quot; aria-label=&quot;Topic header&quot;&gt;

          &lt;span class=&quot;th-tag&quot;&gt;# world-meetups&lt;/span&gt;&lt;span class=&quot;th-tag&quot;&gt;# seville&lt;/span&gt;

        &lt;/div&gt;
        &lt;div class=&quot;th-compact-category&quot; aria-label=&quot;Category: world meetups&quot;&gt;&lt;span class=&quot;th-square&quot;&gt;&lt;/span&gt;&lt;span&gt;world meetups&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;th-meta&quot;&gt;${avatars}&lt;span&gt;8 replies&lt;/span&gt;&lt;span class=&quot;th-activity&quot;&gt;· &amp;nbsp; Last activity 1h ago&lt;/span&gt;&lt;/div&gt;
        &lt;button type=&quot;button&quot; class=&quot;th-assign&quot; aria-label=&quot;Assign topic&quot; data-tooltip=&quot;Assign topic&quot;&gt;${icon(&#x27;user-plus&#x27;)}&lt;span class=&quot;th-assign-label&quot;&gt;Assign topic&lt;/span&gt;&lt;/button&gt;
        &lt;div class=&quot;th-reading&quot;&gt;${avatars}&lt;button type=&quot;button&quot; class=&quot;th-counter&quot; aria-label=&quot;Jump to a post&quot; data-tooltip=&quot;Jump to a post&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;span&gt;/ 9&lt;/span&gt;${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;th-tools&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;th-icon-button th-previous&quot; aria-label=&quot;Previous post&quot; data-tooltip=&quot;Previous post&quot;&gt;${icon(&#x27;chevron-left&#x27;)}&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;th-icon-button th-next&quot; aria-label=&quot;Next post&quot; data-tooltip=&quot;Next post&quot;&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;th-icon-button th-manage&quot; aria-label=&quot;Topic actions&quot; data-tooltip=&quot;Topic actions&quot;&gt;${icon(&#x27;ellipsis&#x27;)}&lt;/button&gt;

      &lt;/header&gt;
      &lt;div class=&quot;th-popover&quot; hidden&gt;&lt;/div&gt;

    const scroller = stage.querySelector(&#x27;.th-scroll&#x27;);
    const replay = study.querySelector(&#x27;.th-replay&#x27;);
    const status = stage.querySelector(&#x27;.th-state&#x27;);
    const popover = stage.querySelector(&#x27;.th-popover&#x27;);
    const notice = stage.querySelector(&#x27;.th-notice&#x27;);
    const expandedMeta = stage.querySelector(&#x27;.th-meta&#x27;);
    const taxonomy = stage.querySelector(&#x27;.th-taxonomy&#x27;);
    const compactCategory = stage.querySelector(&#x27;.th-compact-category&#x27;);

    const motion = { duration: option === &#x27;C&#x27; ? 440 : 380 };
    let isCompact = true;

      assign.setAttribute(&#x27;aria-hidden&#x27;, String(isCompact &amp;&amp; option === &#x27;A&#x27;));
    }

    function updateScroll() {
      const next = isCompact ? scroller.scrollTop &gt; 18 : scroller.scrollTop &gt; 82;
      if (next !== isCompact) {
        isCompact = next;
        stage.classList.toggle(&#x27;th-compact&#x27;, isCompact);

        updateAccessibility();

      const posts = [...scroller.querySelectorAll(&#x27;.th-post&#x27;)];
      let position = 1;
      for (const post of posts) {
        if (post.offsetTop &lt;= scroller.scrollTop + 86) position = Number(post.dataset.post);
      }
      stage.querySelector(&#x27;.th-counter b&#x27;).textContent = position;
      stage.querySelector(&#x27;.th-counter&#x27;).setAttribute(&#x27;aria-label&#x27;, `Post ${position} of 9. Jump to a post`);

      clearTimeout(replayTimer);
      replay.querySelector(&#x27;span&#x27;).textContent = &#x27;Replay&#x27;;
    }

    function flash(message) {
      clearTimeout(noticeTimer);
      notice.textContent = message;
      noticeTimer = setTimeout(() =&gt; { notice.textContent = &#x27;&#x27;; }, 1600);
    }

        button.type = &#x27;button&#x27;;
        button.textContent = label;
        button.addEventListener(&#x27;click&#x27;, () =&gt; { popover.hidden = true; action(); });
        popover.appendChild(button);
      });
      popover.hidden = wasOpen;
      if (!wasOpen) popover.querySelector(&#x27;button&#x27;)?.focus();
    }

    scroller.addEventListener(&#x27;scroll&#x27;, updateScroll, { passive: true });

    requestAnimationFrame(() =&gt; {
      scroller.scrollTop = 280;
      updateScroll();
    });

    replay.addEventListener(&#x27;click&#x27;, () =&gt; {
      stopReplay();
      const token = replayToken;
      replay.querySelector(&#x27;span&#x27;).textContent = &#x27;Playing…&#x27;;
      scrollTo(0);
      replayTimer = setTimeout(() =&gt; {
        if (token !== replayToken) return;
        scrollTo(280);
        replayTimer = setTimeout(() =&gt; {
          if (token === replayToken) replay.querySelector(&#x27;span&#x27;).textContent = &#x27;Replay&#x27;;
        }, reducedMotion.matches ? 50 : motion.duration + 700);
      }, reducedMotion.matches ? 550 : motion.duration + 900);
    });

      [&#x27;Topic details&#x27;, () =&gt; scrollTo(0)]
    ]));
    stage.querySelector(&#x27;.th-counter&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showMenu([
      [&#x27;First post&#x27;, () =&gt; scrollTo(0)],
      [&#x27;Post 3&#x27;, () =&gt; scrollTo(scroller.querySelector(&#x27;[data-post=&quot;3&quot;]&#x27;).offsetTop - 66)],
      [&#x27;Latest reply&#x27;, () =&gt; scrollTo(scroller.scrollHeight)]

    stage.querySelector(&#x27;.th-link&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; flash(&#x27;Topic link preview&#x27;));
    stage.addEventListener(&#x27;keydown&#x27;, event =&gt; {

      tweak.addSlider(motion, &#x27;duration&#x27;, { label: &#x27;Transition duration&#x27;, min: 180, max: 900, step: 20, unit: &#x27;ms&#x27; });
    }
  });
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
})();

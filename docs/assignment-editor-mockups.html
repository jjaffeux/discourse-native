    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

b,

.table :is(th, td) {

}

}

}

}

.table thead th {

}

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;

    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  background: var(--popover);

  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

  align-items: center;

.form-check {

.form-check-input {
  appearance: none;
  width: 14px;

  color: var(--primary-foreground);

  transition:

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

.form-check:not(.form-switch)

  height: 100%;

.form-check-input[type=&quot;radio&quot;]:checked {

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;

  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-range {

.form-range::-moz-range-track {
  height: 28px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.nav-link:focus-visible {

    height: 44px;
  }

&lt;div id=&quot;assignment-study-dialog&quot; data-presentation=&quot;dialog&quot; aria-label=&quot;Topic assignment mockups&quot;&gt;
  &lt;div class=&quot;dialog-as-stage&quot;&gt;
    &lt;article class=&quot;dialog-as-topic&quot; inert&gt;
      &lt;div class=&quot;dialog-as-crumb&quot;&gt;Discourse / Feature&lt;/div&gt;
      &lt;div class=&quot;dialog-as-topic-head&quot;&gt;&lt;h2 class=&quot;dialog-as-topic-title&quot;&gt;Improving topic assignments&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;dialog-as-post&quot;&gt;
        &lt;span class=&quot;dialog-as-avatar&quot; data-user=&quot;martin&quot; aria-hidden=&quot;true&quot;&gt;MB&lt;/span&gt;
        &lt;div&gt;&lt;span class=&quot;dialog-as-post-name&quot;&gt;Martin Brennan&lt;/span&gt;&lt;span class=&quot;dialog-as-post-time&quot;&gt;2h&lt;/span&gt;

        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;
    &lt;div class=&quot;dialog-as-dimmer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;dialog-as-overlay&quot;&gt;
      &lt;section class=&quot;dialog-as-editor&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;dialog-as-title&quot; aria-describedby=&quot;dialog-as-description&quot;&gt;
        &lt;div class=&quot;dialog-as-swipe-handle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
        &lt;header class=&quot;dialog-as-header&quot;&gt;
          &lt;h3 class=&quot;dialog-as-heading&quot; id=&quot;dialog-as-title&quot;&gt;Assign topic&lt;/h3&gt;
          &lt;p class=&quot;dialog-as-description&quot; id=&quot;dialog-as-description&quot;&gt;Choose one person or group.&lt;/p&gt;
          &lt;button class=&quot;dialog-as-button dialog-as-ghost dialog-as-icon-button dialog-as-close&quot; type=&quot;button&quot; aria-label=&quot;Close assignment&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
        &lt;/header&gt;
        &lt;div class=&quot;dialog-as-main&quot;&gt;
          &lt;label class=&quot;dialog-as-field-label&quot; for=&quot;dialog-as-search&quot;&gt;Assign to&lt;/label&gt;
          &lt;div class=&quot;dialog-as-search&quot;&gt;&lt;i data-lucide=&quot;search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;input id=&quot;dialog-as-search&quot; type=&quot;search&quot; placeholder=&quot;Search users or groups…&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; aria-controls=&quot;dialog-as-results&quot; /&gt;&lt;/div&gt;
          &lt;div class=&quot;dialog-as-results-caption&quot;&gt;&lt;span class=&quot;dialog-as-result-kind&quot;&gt;Suggested&lt;/span&gt;&lt;span class=&quot;dialog-as-result-count&quot;&gt;6 results&lt;/span&gt;&lt;/div&gt;

            &lt;div class=&quot;dialog-as-note-field&quot; id=&quot;dialog-as-note-content&quot; hidden&gt;&lt;label class=&quot;dialog-as-field-label&quot; for=&quot;dialog-as-note&quot;&gt;Note&lt;span class=&quot;dialog-as-note-optional&quot;&gt;Optional&lt;/span&gt;&lt;/label&gt;&lt;textarea id=&quot;dialog-as-note&quot; rows=&quot;3&quot; placeholder=&quot;Add context for the assignee…&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;dialog-as-error&quot; role=&quot;alert&quot; hidden&gt;&lt;strong&gt;Assignment wasn’t saved&lt;/strong&gt;&lt;span&gt;Your selection and note are still here. Try again.&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;footer class=&quot;dialog-as-footer&quot;&gt;&lt;button class=&quot;dialog-as-button dialog-as-ghost dialog-as-unassign&quot; type=&quot;button&quot; hidden&gt;Unassign&lt;/button&gt;&lt;button class=&quot;dialog-as-button dialog-as-cancel&quot; type=&quot;button&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;dialog-as-button dialog-as-primary dialog-as-submit&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Assign to @j.jaffeux&lt;/span&gt;&lt;/button&gt;&lt;/footer&gt;
      &lt;/section&gt;
    &lt;/div&gt;
    &lt;div class=&quot;dialog-as-toast&quot; role=&quot;status&quot; hidden&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p class=&quot;dialog-as-sr dialog-as-live&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;assignment-study-dialog&#x27;);
  const $ = selector =&gt; root.querySelector(selector);
  const people = [
    { id: &#x27;joffrey&#x27;, name: &#x27;Joffrey Jaffeux&#x27;, handle: &#x27;@j.jaffeux&#x27;, initials: &#x27;JJ&#x27; },
    { id: &#x27;mark&#x27;, name: &#x27;MarkDoerr&#x27;, handle: &#x27;@MarkDoerr&#x27;, initials: &#x27;MD&#x27; },
    { id: &#x27;martin&#x27;, name: &#x27;Martin Brennan&#x27;, handle: &#x27;@martin&#x27;, initials: &#x27;MB&#x27; },
    { id: &#x27;peter&#x27;, name: &#x27;Peter&#x27;, handle: &#x27;@peter&#x27;, initials: &#x27;P&#x27; },
    { id: &#x27;support&#x27;, name: &#x27;Support&#x27;, handle: &#x27;@support&#x27;, initials: &#x27;S&#x27;, group: true },
    { id: &#x27;team&#x27;, name: &#x27;Team&#x27;, handle: &#x27;@team&#x27;, initials: &#x27;T&#x27;, group: true }
  ];
  const design = { presentation: &#x27;dialog&#x27;, scenario: &#x27;selected&#x27;, statuses: false };
  let selected = &#x27;joffrey&#x27;, noteOpen = false, open = true, busy = false, saved = null, savedNote = &#x27;&#x27;, savedStatus = &#x27;Open&#x27;, editing = false, timer;
  const selectedPerson = () =&gt; people.find(person =&gt; person.id === selected);
  const icons = () =&gt; { if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } }); };

  function renderChoices() {
    const term = $(&#x27;#dialog-as-search&#x27;).value.trim().toLowerCase();
    const matches = people.filter(person =&gt; (person.name + &#x27; &#x27; + person.handle).toLowerCase().includes(term));
    const list = $(&#x27;#dialog-as-results&#x27;);
    list.replaceChildren();
    for (const person of matches) {
      const label = document.createElement(&#x27;label&#x27;);
      label.className = &#x27;dialog-as-choice&#x27;;
      const avatar = document.createElement(&#x27;span&#x27;);
      avatar.className = &#x27;dialog-as-avatar&#x27;; avatar.dataset.user = person.id; avatar.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      if (person.group) avatar.innerHTML = &#x27;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;; else avatar.textContent = person.initials;
      const identity = document.createElement(&#x27;span&#x27;); identity.className = &#x27;dialog-as-person&#x27;;
      const name = document.createElement(&#x27;span&#x27;); name.className = &#x27;dialog-as-name&#x27;; name.style.display = &#x27;block&#x27;; name.textContent = person.name;
      const handle = document.createElement(&#x27;span&#x27;); handle.className = &#x27;dialog-as-handle&#x27;; handle.textContent = person.handle;
      identity.append(name, handle); label.append(avatar, identity);
      if (person.group) { const badge = document.createElement(&#x27;span&#x27;); badge.className = &#x27;dialog-as-badge&#x27;; badge.textContent = &#x27;Group&#x27;; label.append(badge); }
      const radio = document.createElement(&#x27;input&#x27;); radio.type = &#x27;radio&#x27;; radio.name = &#x27;dialog-as-assignee&#x27;; radio.value = person.id; radio.checked = person.id === selected; radio.disabled = busy;
      radio.setAttribute(&#x27;aria-label&#x27;, person.name + &#x27;, &#x27; + person.handle + (person.group ? &#x27;, group&#x27; : &#x27;&#x27;));
      radio.addEventListener(&#x27;change&#x27;, () =&gt; { selected = person.id; $(&#x27;.dialog-as-error&#x27;).hidden = true; renderChrome(); });
      label.append(radio); list.append(label);
    }
    if (!matches.length) {
      const empty = document.createElement(&#x27;div&#x27;); empty.className = &#x27;dialog-as-empty&#x27;;
      empty.innerHTML = &#x27;&lt;strong&gt;No matching users or groups&lt;/strong&gt;&lt;span&gt;Try a different name or username.&lt;/span&gt;&#x27;;
      list.append(empty);
    }
    $(&#x27;.dialog-as-result-kind&#x27;).textContent = term ? &#x27;Search results&#x27; : &#x27;Suggested&#x27;;
    $(&#x27;.dialog-as-result-count&#x27;).textContent = `${matches.length} result${matches.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
    $(&#x27;.dialog-as-live&#x27;).textContent = `${matches.length} matching users or groups.`;
    renderChrome(); icons();
  }

  function renderChrome() {
    const person = selectedPerson();
    const away = selected &amp;&amp; ![...root.querySelectorAll(&#x27;input[name=&quot;dialog-as-assignee&quot;]&#x27;)].some(input =&gt; input.value === selected);
    $(&#x27;.dialog-as-selected-away&#x27;).hidden = !away;
    $(&#x27;.dialog-as-selected-away&#x27;).textContent = away ? `Selected: ${person.handle}` : &#x27;&#x27;;
    const primary = $(&#x27;.dialog-as-submit&#x27;);
    primary.disabled = !selected || busy;
    primary.querySelector(&#x27;span&#x27;).textContent = busy ? &#x27;Assigning…&#x27; : editing ? &#x27;Save changes&#x27; : person ? `Assign to ${person.handle}` : &#x27;Assign&#x27;;
    $(&#x27;.dialog-as-cancel&#x27;).disabled = busy; $(&#x27;.dialog-as-close&#x27;).disabled = busy; $(&#x27;.dialog-as-unassign&#x27;).disabled = busy;
    $(&#x27;.dialog-as-unassign&#x27;).hidden = !editing;
    $(&#x27;#dialog-as-title&#x27;).textContent = editing ? &#x27;Edit assignment&#x27; : &#x27;Assign topic&#x27;;
    $(&#x27;.dialog-as-note-trigger&#x27;).disabled = busy;
    $(&#x27;.dialog-as-note-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(noteOpen));
    $(&#x27;.dialog-as-note-trigger span&#x27;).textContent = noteOpen ? &#x27;Hide note&#x27; : $(&#x27;#dialog-as-note&#x27;).value ? &#x27;Edit note&#x27; : &#x27;Add a note&#x27;;
    $(&#x27;.dialog-as-note-field&#x27;).hidden = !noteOpen &amp;&amp; design.presentation !== &#x27;sheet&#x27;;
    $(&#x27;.dialog-as-status&#x27;).hidden = !design.statuses;
    root.querySelectorAll(&#x27;input, textarea&#x27;).forEach(input =&gt; { input.disabled = busy; });
    $(&#x27;.dialog-as-editor&#x27;).setAttribute(&#x27;aria-busy&#x27;, String(busy));
  }

  function setOpen(value) {
    if (busy) return;
    open = value;
    $(&#x27;.dialog-as-overlay&#x27;).hidden = !open; $(&#x27;.dialog-as-dimmer&#x27;).hidden = !open; $(&#x27;.dialog-as-topic&#x27;).inert = open;
    if (open) { $(&#x27;.dialog-as-toast&#x27;).hidden = true; requestAnimationFrame(() =&gt; $(&#x27;#dialog-as-search&#x27;).focus({ preventScroll: true })); }
    else $(&#x27;.dialog-as-open&#x27;).focus({ preventScroll: true });
  }

  function showSaved(message) {
    $(&#x27;.dialog-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.dialog-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    setOpen(false); $(&#x27;.dialog-as-toast span&#x27;).textContent = message; $(&#x27;.dialog-as-toast&#x27;).hidden = false; icons();
  }

  function applyDesign() {
    clearTimeout(timer); busy = false;
    root.dataset.presentation = design.presentation;
    selected = design.scenario === &#x27;unselected&#x27; || design.scenario === &#x27;empty&#x27; ? null : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;joffrey&#x27;;
    editing = design.scenario === &#x27;edit&#x27;; saved = editing ? selectedPerson() : null;
    noteOpen = design.scenario === &#x27;error&#x27; || editing;
    $(&#x27;#dialog-as-search&#x27;).value = design.scenario === &#x27;empty&#x27; ? &#x27;no-match&#x27; : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;&#x27;;
    $(&#x27;#dialog-as-note&#x27;).value = design.scenario === &#x27;error&#x27; || editing ? &#x27;Could you review the proposed assignment flow?&#x27; : &#x27;&#x27;;
    savedNote = editing ? $(&#x27;#dialog-as-note&#x27;).value : &#x27;&#x27;; savedStatus = &#x27;Open&#x27;;
    root.querySelectorAll(&#x27;input[name=&quot;dialog-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; });
    $(&#x27;.dialog-as-error&#x27;).hidden = design.scenario !== &#x27;error&#x27;;
    $(&#x27;.dialog-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.dialog-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    $(&#x27;.dialog-as-overlay&#x27;).hidden = false; $(&#x27;.dialog-as-dimmer&#x27;).hidden = false; $(&#x27;.dialog-as-topic&#x27;).inert = true; $(&#x27;.dialog-as-toast&#x27;).hidden = true; open = true;
    renderChoices();
  }

  $(&#x27;#dialog-as-search&#x27;).addEventListener(&#x27;input&#x27;, renderChoices);
  $(&#x27;.dialog-as-note-trigger&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { noteOpen = !noteOpen; renderChrome(); if (noteOpen) $(&#x27;#dialog-as-note&#x27;).focus({ preventScroll: true }); });
  $(&#x27;.dialog-as-cancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.dialog-as-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.dialog-as-dimmer&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.dialog-as-open&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { editing = !!saved; selected = saved?.id || null; $(&#x27;#dialog-as-search&#x27;).value = &#x27;&#x27;; $(&#x27;#dialog-as-note&#x27;).value = savedNote; noteOpen = !!savedNote; root.querySelectorAll(&#x27;input[name=&quot;dialog-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; }); $(&#x27;.dialog-as-error&#x27;).hidden = true; renderChoices(); setOpen(true); });
  $(&#x27;.dialog-as-submit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (!selected || busy) return;
    busy = true; $(&#x27;.dialog-as-error&#x27;).hidden = true; renderChrome();
    timer = setTimeout(() =&gt; { saved = selectedPerson(); savedNote = $(&#x27;#dialog-as-note&#x27;).value; savedStatus = root.querySelector(&#x27;input[name=&quot;dialog-as-status&quot;]:checked&#x27;).value; busy = false; renderChrome(); showSaved(`Topic assigned to ${saved.handle}`); }, 700);
  });
  $(&#x27;.dialog-as-unassign&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { saved = null; savedNote = &#x27;&#x27;; savedStatus = &#x27;Open&#x27;; selected = null; editing = false; renderChrome(); showSaved(&#x27;Assignment removed&#x27;); });
  root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (!open) return;
    if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); setOpen(false); }
    if (event.key !== &#x27;Tab&#x27;) return;
    const focusable = [...$(&#x27;.dialog-as-editor&#x27;).querySelectorAll(&#x27;button:not(:disabled), input:not(:disabled), textarea:not(:disabled)&#x27;)].filter(element =&gt; element.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey &amp;&amp; document.activeElement === first) { event.preventDefault(); last.focus(); }
    if (!event.shiftKey &amp;&amp; document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  let dragStart = null;
  $(&#x27;.dialog-as-swipe-handle&#x27;).addEventListener(&#x27;pointerdown&#x27;, event =&gt; { dragStart = event.clientY; event.target.setPointerCapture(event.pointerId); });
  $(&#x27;.dialog-as-swipe-handle&#x27;).addEventListener(&#x27;pointerup&#x27;, event =&gt; { if (dragStart !== null &amp;&amp; event.clientY - dragStart &gt; 55) setOpen(false); dragStart = null; });
  root.addEventListener(&#x27;assignment-design&#x27;, event =&gt; { Object.assign(design, event.detail); applyDesign(); });
  applyDesign();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: applyDesign });
    tweak.addSelect(design, &#x27;presentation&#x27;, { label: &#x27;Presentation&#x27;, options: [{ label: &#x27;Focused dialog · recommended&#x27;, value: &#x27;dialog&#x27; }, { label: &#x27;Side sheet&#x27;, value: &#x27;sheet&#x27; }, { label: &#x27;Mobile drawer&#x27;, value: &#x27;drawer&#x27; }] });
    tweak.addSelect(design, &#x27;scenario&#x27;, { label: &#x27;State&#x27;, options: [{ label: &#x27;Person selected&#x27;, value: &#x27;selected&#x27; }, { label: &#x27;Nothing selected&#x27;, value: &#x27;unselected&#x27; }, { label: &#x27;Group selected&#x27;, value: &#x27;group&#x27; }, { label: &#x27;No search results&#x27;, value: &#x27;empty&#x27; }, { label: &#x27;Save failed&#x27;, value: &#x27;error&#x27; }, { label: &#x27;Edit existing assignment&#x27;, value: &#x27;edit&#x27; }] });
    tweak.addToggle(design, &#x27;statuses&#x27;, { label: &#x27;Site has assignment statuses&#x27; });
  }
})();
&lt;/script&gt;

  &lt;/section&gt;
  &lt;section&gt;&lt;h2&gt;B. Side sheet&lt;/h2&gt;&lt;p&gt;More room for context. The note stays visible and the actions stay at the bottom.&lt;/p&gt;

      const handle = document.createElement(&#x27;span&#x27;); handle.className = &#x27;sheet-as-handle&#x27;; handle.textContent = person.handle;
      identity.append(name, handle); label.append(avatar, identity);
      if (person.group) { const badge = document.createElement(&#x27;span&#x27;); badge.className = &#x27;sheet-as-badge&#x27;; badge.textContent = &#x27;Group&#x27;; label.append(badge); }
      const radio = document.createElement(&#x27;input&#x27;); radio.type = &#x27;radio&#x27;; radio.name = &#x27;sheet-as-assignee&#x27;; radio.value = person.id; radio.checked = person.id === selected; radio.disabled = busy;
      radio.setAttribute(&#x27;aria-label&#x27;, person.name + &#x27;, &#x27; + person.handle + (person.group ? &#x27;, group&#x27; : &#x27;&#x27;));
      radio.addEventListener(&#x27;change&#x27;, () =&gt; { selected = person.id; $(&#x27;.sheet-as-error&#x27;).hidden = true; renderChrome(); });
      label.append(radio); list.append(label);
    }
    if (!matches.length) {
      const empty = document.createElement(&#x27;div&#x27;); empty.className = &#x27;sheet-as-empty&#x27;;
      empty.innerHTML = &#x27;&lt;strong&gt;No matching users or groups&lt;/strong&gt;&lt;span&gt;Try a different name or username.&lt;/span&gt;&#x27;;
      list.append(empty);
    }
    $(&#x27;.sheet-as-result-kind&#x27;).textContent = term ? &#x27;Search results&#x27; : &#x27;Suggested&#x27;;
    $(&#x27;.sheet-as-result-count&#x27;).textContent = `${matches.length} result${matches.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
    $(&#x27;.sheet-as-live&#x27;).textContent = `${matches.length} matching users or groups.`;
    renderChrome(); icons();
  }

  function renderChrome() {
    const person = selectedPerson();
    const away = selected &amp;&amp; ![...root.querySelectorAll(&#x27;input[name=&quot;sheet-as-assignee&quot;]&#x27;)].some(input =&gt; input.value === selected);
    $(&#x27;.sheet-as-selected-away&#x27;).hidden = !away;
    $(&#x27;.sheet-as-selected-away&#x27;).textContent = away ? `Selected: ${person.handle}` : &#x27;&#x27;;
    const primary = $(&#x27;.sheet-as-submit&#x27;);
    primary.disabled = !selected || busy;
    primary.querySelector(&#x27;span&#x27;).textContent = busy ? &#x27;Assigning…&#x27; : editing ? &#x27;Save changes&#x27; : person ? `Assign to ${person.handle}` : &#x27;Assign&#x27;;
    $(&#x27;.sheet-as-cancel&#x27;).disabled = busy; $(&#x27;.sheet-as-close&#x27;).disabled = busy; $(&#x27;.sheet-as-unassign&#x27;).disabled = busy;
    $(&#x27;.sheet-as-unassign&#x27;).hidden = !editing;
    $(&#x27;#sheet-as-title&#x27;).textContent = editing ? &#x27;Edit assignment&#x27; : &#x27;Assign topic&#x27;;
    $(&#x27;.sheet-as-note-trigger&#x27;).disabled = busy;
    $(&#x27;.sheet-as-note-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(noteOpen));
    $(&#x27;.sheet-as-note-trigger span&#x27;).textContent = noteOpen ? &#x27;Hide note&#x27; : $(&#x27;#sheet-as-note&#x27;).value ? &#x27;Edit note&#x27; : &#x27;Add a note&#x27;;
    $(&#x27;.sheet-as-note-field&#x27;).hidden = !noteOpen &amp;&amp; design.presentation !== &#x27;sheet&#x27;;
    $(&#x27;.sheet-as-status&#x27;).hidden = !design.statuses;
    root.querySelectorAll(&#x27;input, textarea&#x27;).forEach(input =&gt; { input.disabled = busy; });
    $(&#x27;.sheet-as-editor&#x27;).setAttribute(&#x27;aria-busy&#x27;, String(busy));
  }

  function setOpen(value) {
    if (busy) return;
    open = value;
    $(&#x27;.sheet-as-overlay&#x27;).hidden = !open; $(&#x27;.sheet-as-dimmer&#x27;).hidden = !open; $(&#x27;.sheet-as-topic&#x27;).inert = open;
    if (open) { $(&#x27;.sheet-as-toast&#x27;).hidden = true; requestAnimationFrame(() =&gt; $(&#x27;#sheet-as-search&#x27;).focus({ preventScroll: true })); }
    else $(&#x27;.sheet-as-open&#x27;).focus({ preventScroll: true });
  }

  function showSaved(message) {
    $(&#x27;.sheet-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.sheet-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    setOpen(false); $(&#x27;.sheet-as-toast span&#x27;).textContent = message; $(&#x27;.sheet-as-toast&#x27;).hidden = false; icons();
  }

  function applyDesign() {
    clearTimeout(timer); busy = false;
    root.dataset.presentation = design.presentation;
    selected = design.scenario === &#x27;unselected&#x27; || design.scenario === &#x27;empty&#x27; ? null : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;joffrey&#x27;;
    editing = design.scenario === &#x27;edit&#x27;; saved = editing ? selectedPerson() : null;
    noteOpen = design.scenario === &#x27;error&#x27; || editing;
    $(&#x27;#sheet-as-search&#x27;).value = design.scenario === &#x27;empty&#x27; ? &#x27;no-match&#x27; : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;&#x27;;
    $(&#x27;#sheet-as-note&#x27;).value = design.scenario === &#x27;error&#x27; || editing ? &#x27;Could you review the proposed assignment flow?&#x27; : &#x27;&#x27;;
    savedNote = editing ? $(&#x27;#sheet-as-note&#x27;).value : &#x27;&#x27;; savedStatus = &#x27;Open&#x27;;
    root.querySelectorAll(&#x27;input[name=&quot;sheet-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; });
    $(&#x27;.sheet-as-error&#x27;).hidden = design.scenario !== &#x27;error&#x27;;
    $(&#x27;.sheet-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.sheet-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    $(&#x27;.sheet-as-overlay&#x27;).hidden = false; $(&#x27;.sheet-as-dimmer&#x27;).hidden = false; $(&#x27;.sheet-as-topic&#x27;).inert = true; $(&#x27;.sheet-as-toast&#x27;).hidden = true; open = true;
    renderChoices();
  }

  $(&#x27;#sheet-as-search&#x27;).addEventListener(&#x27;input&#x27;, renderChoices);
  $(&#x27;.sheet-as-note-trigger&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { noteOpen = !noteOpen; renderChrome(); if (noteOpen) $(&#x27;#sheet-as-note&#x27;).focus({ preventScroll: true }); });
  $(&#x27;.sheet-as-cancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.sheet-as-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.sheet-as-dimmer&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.sheet-as-open&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { editing = !!saved; selected = saved?.id || null; $(&#x27;#sheet-as-search&#x27;).value = &#x27;&#x27;; $(&#x27;#sheet-as-note&#x27;).value = savedNote; noteOpen = !!savedNote; root.querySelectorAll(&#x27;input[name=&quot;sheet-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; }); $(&#x27;.sheet-as-error&#x27;).hidden = true; renderChoices(); setOpen(true); });
  $(&#x27;.sheet-as-submit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (!selected || busy) return;
    busy = true; $(&#x27;.sheet-as-error&#x27;).hidden = true; renderChrome();
    timer = setTimeout(() =&gt; { saved = selectedPerson(); savedNote = $(&#x27;#sheet-as-note&#x27;).value; savedStatus = root.querySelector(&#x27;input[name=&quot;sheet-as-status&quot;]:checked&#x27;).value; busy = false; renderChrome(); showSaved(`Topic assigned to ${saved.handle}`); }, 700);
  });
  $(&#x27;.sheet-as-unassign&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { saved = null; savedNote = &#x27;&#x27;; savedStatus = &#x27;Open&#x27;; selected = null; editing = false; renderChrome(); showSaved(&#x27;Assignment removed&#x27;); });
  root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (!open) return;
    if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); setOpen(false); }
    if (event.key !== &#x27;Tab&#x27;) return;
    const focusable = [...$(&#x27;.sheet-as-editor&#x27;).querySelectorAll(&#x27;button:not(:disabled), input:not(:disabled), textarea:not(:disabled)&#x27;)].filter(element =&gt; element.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];

    if (!event.shiftKey &amp;&amp; document.activeElement === last) { event.preventDefault(); first.focus(); }

  $(&#x27;.sheet-as-swipe-handle&#x27;).addEventListener(&#x27;pointerdown&#x27;, event =&gt; { dragStart = event.clientY; event.target.setPointerCapture(event.pointerId); });
  $(&#x27;.sheet-as-swipe-handle&#x27;).addEventListener(&#x27;pointerup&#x27;, event =&gt; { if (dragStart !== null &amp;&amp; event.clientY - dragStart &gt; 55) setOpen(false); dragStart = null; });
  root.addEventListener(&#x27;assignment-design&#x27;, event =&gt; { Object.assign(design, event.detail); applyDesign(); });
  applyDesign();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: applyDesign });
    tweak.addSelect(design, &#x27;presentation&#x27;, { label: &#x27;Presentation&#x27;, options: [{ label: &#x27;Focused dialog · recommended&#x27;, value: &#x27;dialog&#x27; }, { label: &#x27;Side sheet&#x27;, value: &#x27;sheet&#x27; }, { label: &#x27;Mobile drawer&#x27;, value: &#x27;drawer&#x27; }] });
    tweak.addSelect(design, &#x27;scenario&#x27;, { label: &#x27;State&#x27;, options: [{ label: &#x27;Person selected&#x27;, value: &#x27;selected&#x27; }, { label: &#x27;Nothing selected&#x27;, value: &#x27;unselected&#x27; }, { label: &#x27;Group selected&#x27;, value: &#x27;group&#x27; }, { label: &#x27;No search results&#x27;, value: &#x27;empty&#x27; }, { label: &#x27;Save failed&#x27;, value: &#x27;error&#x27; }, { label: &#x27;Edit existing assignment&#x27;, value: &#x27;edit&#x27; }] });
    tweak.addToggle(design, &#x27;statuses&#x27;, { label: &#x27;Site has assignment statuses&#x27; });
  }
})();
&lt;/script&gt;

&lt;div id=&quot;assignment-study-drawer&quot; data-presentation=&quot;drawer&quot; aria-label=&quot;Topic assignment mockups&quot;&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;assignment-study-drawer&#x27;);
  const $ = selector =&gt; root.querySelector(selector);
  const people = [
    { id: &#x27;joffrey&#x27;, name: &#x27;Joffrey Jaffeux&#x27;, handle: &#x27;@j.jaffeux&#x27;, initials: &#x27;JJ&#x27; },
    { id: &#x27;mark&#x27;, name: &#x27;MarkDoerr&#x27;, handle: &#x27;@MarkDoerr&#x27;, initials: &#x27;MD&#x27; },
    { id: &#x27;martin&#x27;, name: &#x27;Martin Brennan&#x27;, handle: &#x27;@martin&#x27;, initials: &#x27;MB&#x27; },
    { id: &#x27;peter&#x27;, name: &#x27;Peter&#x27;, handle: &#x27;@peter&#x27;, initials: &#x27;P&#x27; },
    { id: &#x27;support&#x27;, name: &#x27;Support&#x27;, handle: &#x27;@support&#x27;, initials: &#x27;S&#x27;, group: true },
    { id: &#x27;team&#x27;, name: &#x27;Team&#x27;, handle: &#x27;@team&#x27;, initials: &#x27;T&#x27;, group: true }
  ];
  const design = { presentation: &#x27;drawer&#x27;, scenario: &#x27;selected&#x27;, statuses: false };
  let selected = &#x27;joffrey&#x27;, noteOpen = false, open = true, busy = false, saved = null, savedNote = &#x27;&#x27;, savedStatus = &#x27;Open&#x27;, editing = false, timer;
  const selectedPerson = () =&gt; people.find(person =&gt; person.id === selected);
  const icons = () =&gt; { if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } }); };

  function renderChoices() {
    const term = $(&#x27;#drawer-as-search&#x27;).value.trim().toLowerCase();
    const matches = people.filter(person =&gt; (person.name + &#x27; &#x27; + person.handle).toLowerCase().includes(term));
    const list = $(&#x27;#drawer-as-results&#x27;);
    list.replaceChildren();
    for (const person of matches) {
      const label = document.createElement(&#x27;label&#x27;);
      label.className = &#x27;drawer-as-choice&#x27;;
      const avatar = document.createElement(&#x27;span&#x27;);
      avatar.className = &#x27;drawer-as-avatar&#x27;; avatar.dataset.user = person.id; avatar.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      if (person.group) avatar.innerHTML = &#x27;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;; else avatar.textContent = person.initials;
      const identity = document.createElement(&#x27;span&#x27;); identity.className = &#x27;drawer-as-person&#x27;;
      const name = document.createElement(&#x27;span&#x27;); name.className = &#x27;drawer-as-name&#x27;; name.style.display = &#x27;block&#x27;; name.textContent = person.name;
      const handle = document.createElement(&#x27;span&#x27;); handle.className = &#x27;drawer-as-handle&#x27;; handle.textContent = person.handle;
      identity.append(name, handle); label.append(avatar, identity);
      if (person.group) { const badge = document.createElement(&#x27;span&#x27;); badge.className = &#x27;drawer-as-badge&#x27;; badge.textContent = &#x27;Group&#x27;; label.append(badge); }
      const radio = document.createElement(&#x27;input&#x27;); radio.type = &#x27;radio&#x27;; radio.name = &#x27;drawer-as-assignee&#x27;; radio.value = person.id; radio.checked = person.id === selected; radio.disabled = busy;
      radio.setAttribute(&#x27;aria-label&#x27;, person.name + &#x27;, &#x27; + person.handle + (person.group ? &#x27;, group&#x27; : &#x27;&#x27;));
      radio.addEventListener(&#x27;change&#x27;, () =&gt; { selected = person.id; $(&#x27;.drawer-as-error&#x27;).hidden = true; renderChrome(); });
      label.append(radio); list.append(label);
    }
    if (!matches.length) {
      const empty = document.createElement(&#x27;div&#x27;); empty.className = &#x27;drawer-as-empty&#x27;;
      empty.innerHTML = &#x27;&lt;strong&gt;No matching users or groups&lt;/strong&gt;&lt;span&gt;Try a different name or username.&lt;/span&gt;&#x27;;
      list.append(empty);
    }
    $(&#x27;.drawer-as-result-kind&#x27;).textContent = term ? &#x27;Search results&#x27; : &#x27;Suggested&#x27;;
    $(&#x27;.drawer-as-result-count&#x27;).textContent = `${matches.length} result${matches.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}`;
    $(&#x27;.drawer-as-live&#x27;).textContent = `${matches.length} matching users or groups.`;
    renderChrome(); icons();
  }

  function renderChrome() {
    const person = selectedPerson();
    const away = selected &amp;&amp; ![...root.querySelectorAll(&#x27;input[name=&quot;drawer-as-assignee&quot;]&#x27;)].some(input =&gt; input.value === selected);
    $(&#x27;.drawer-as-selected-away&#x27;).hidden = !away;
    $(&#x27;.drawer-as-selected-away&#x27;).textContent = away ? `Selected: ${person.handle}` : &#x27;&#x27;;
    const primary = $(&#x27;.drawer-as-submit&#x27;);
    primary.disabled = !selected || busy;
    primary.querySelector(&#x27;span&#x27;).textContent = busy ? &#x27;Assigning…&#x27; : editing ? &#x27;Save changes&#x27; : person ? `Assign to ${person.handle}` : &#x27;Assign&#x27;;
    $(&#x27;.drawer-as-cancel&#x27;).disabled = busy; $(&#x27;.drawer-as-close&#x27;).disabled = busy; $(&#x27;.drawer-as-unassign&#x27;).disabled = busy;
    $(&#x27;.drawer-as-unassign&#x27;).hidden = !editing;
    $(&#x27;#drawer-as-title&#x27;).textContent = editing ? &#x27;Edit assignment&#x27; : &#x27;Assign topic&#x27;;
    $(&#x27;.drawer-as-note-trigger&#x27;).disabled = busy;
    $(&#x27;.drawer-as-note-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, String(noteOpen));
    $(&#x27;.drawer-as-note-trigger span&#x27;).textContent = noteOpen ? &#x27;Hide note&#x27; : $(&#x27;#drawer-as-note&#x27;).value ? &#x27;Edit note&#x27; : &#x27;Add a note&#x27;;
    $(&#x27;.drawer-as-note-field&#x27;).hidden = !noteOpen &amp;&amp; design.presentation !== &#x27;sheet&#x27;;
    $(&#x27;.drawer-as-status&#x27;).hidden = !design.statuses;
    root.querySelectorAll(&#x27;input, textarea&#x27;).forEach(input =&gt; { input.disabled = busy; });
    $(&#x27;.drawer-as-editor&#x27;).setAttribute(&#x27;aria-busy&#x27;, String(busy));
  }

  function setOpen(value) {
    if (busy) return;
    open = value;
    $(&#x27;.drawer-as-overlay&#x27;).hidden = !open; $(&#x27;.drawer-as-dimmer&#x27;).hidden = !open; $(&#x27;.drawer-as-topic&#x27;).inert = open;
    if (open) { $(&#x27;.drawer-as-toast&#x27;).hidden = true; requestAnimationFrame(() =&gt; $(&#x27;#drawer-as-search&#x27;).focus({ preventScroll: true })); }
    else $(&#x27;.drawer-as-open&#x27;).focus({ preventScroll: true });
  }

  function showSaved(message) {
    $(&#x27;.drawer-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.drawer-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    setOpen(false); $(&#x27;.drawer-as-toast span&#x27;).textContent = message; $(&#x27;.drawer-as-toast&#x27;).hidden = false; icons();
  }

  function applyDesign() {
    clearTimeout(timer); busy = false;
    root.dataset.presentation = design.presentation;
    selected = design.scenario === &#x27;unselected&#x27; || design.scenario === &#x27;empty&#x27; ? null : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;joffrey&#x27;;
    editing = design.scenario === &#x27;edit&#x27;; saved = editing ? selectedPerson() : null;
    noteOpen = design.scenario === &#x27;error&#x27; || editing;
    $(&#x27;#drawer-as-search&#x27;).value = design.scenario === &#x27;empty&#x27; ? &#x27;no-match&#x27; : design.scenario === &#x27;group&#x27; ? &#x27;support&#x27; : &#x27;&#x27;;
    $(&#x27;#drawer-as-note&#x27;).value = design.scenario === &#x27;error&#x27; || editing ? &#x27;Could you review the proposed assignment flow?&#x27; : &#x27;&#x27;;
    savedNote = editing ? $(&#x27;#drawer-as-note&#x27;).value : &#x27;&#x27;; savedStatus = &#x27;Open&#x27;;
    root.querySelectorAll(&#x27;input[name=&quot;drawer-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; });
    $(&#x27;.drawer-as-error&#x27;).hidden = design.scenario !== &#x27;error&#x27;;
    $(&#x27;.drawer-as-topic-assignment-label&#x27;).textContent = saved ? `Assigned to ${saved.handle}` : &#x27;Unassigned&#x27;;
    $(&#x27;.drawer-as-open&#x27;).innerHTML = &#x27;&lt;i data-lucide=&quot;user-round-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; + (saved ? &#x27;Edit assignment&#x27; : &#x27;Assign&#x27;);
    $(&#x27;.drawer-as-overlay&#x27;).hidden = false; $(&#x27;.drawer-as-dimmer&#x27;).hidden = false; $(&#x27;.drawer-as-topic&#x27;).inert = true; $(&#x27;.drawer-as-toast&#x27;).hidden = true; open = true;
    renderChoices();
  }

  $(&#x27;#drawer-as-search&#x27;).addEventListener(&#x27;input&#x27;, renderChoices);
  $(&#x27;.drawer-as-note-trigger&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { noteOpen = !noteOpen; renderChrome(); if (noteOpen) $(&#x27;#drawer-as-note&#x27;).focus({ preventScroll: true }); });
  $(&#x27;.drawer-as-cancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.drawer-as-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.drawer-as-dimmer&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setOpen(false));
  $(&#x27;.drawer-as-open&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { editing = !!saved; selected = saved?.id || null; $(&#x27;#drawer-as-search&#x27;).value = &#x27;&#x27;; $(&#x27;#drawer-as-note&#x27;).value = savedNote; noteOpen = !!savedNote; root.querySelectorAll(&#x27;input[name=&quot;drawer-as-status&quot;]&#x27;).forEach(input =&gt; { input.checked = input.value === savedStatus; }); $(&#x27;.drawer-as-error&#x27;).hidden = true; renderChoices(); setOpen(true); });
  $(&#x27;.drawer-as-submit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {

  });
  $(&#x27;.drawer-as-unassign&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { saved = null; savedNote = &#x27;&#x27;; savedStatus = &#x27;Open&#x27;; selected = null; editing = false; renderChrome(); showSaved(&#x27;Assignment removed&#x27;); });
  root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (!open) return;
    if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); setOpen(false); }
    if (event.key !== &#x27;Tab&#x27;) return;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

      }

  };

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }

  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);

      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

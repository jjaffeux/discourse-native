  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {

  const badges = [
    { id: &quot;autobiographer&quot;, group: &quot;getting-started&quot;, tier: &quot;bronze&quot;, icon: &quot;user-pen&quot;, count: 60, earned: true, en: &quot;Autobiographer&quot;, fr: &quot;Autobiographe&quot;, description: { en: &quot;Filled out profile information&quot;, fr: &quot;A complété les informations de son profil&quot; }, long: { en: &quot;Fill out your user profile and choose a profile picture. Let the community know a little more about you and your interests.&quot;, fr: &quot;Complétez votre profil et choisissez une photo. Présentez-vous à la communauté et partagez vos centres d’intérêt.&quot; } },

    { id: &quot;editor&quot;, group: &quot;getting-started&quot;, tier: &quot;bronze&quot;, icon: &quot;pencil&quot;, count: 184, earned: true, en: &quot;Editor&quot;, fr: &quot;Éditeur&quot;, description: { en: &quot;First post edit&quot;, fr: &quot;Première modification d’un message&quot; }, long: { en: &quot;Edit one of your posts for the first time. Improve the formatting, fix a mistake, or add something you missed.&quot;, fr: &quot;Modifiez l’un de vos messages pour la première fois. Améliorez la mise en forme, corrigez une erreur ou ajoutez une précision.&quot; } },
    { id: &quot;wiki-editor&quot;, group: &quot;getting-started&quot;, tier: &quot;bronze&quot;, icon: &quot;square-pen&quot;, count: 151, earned: true, en: &quot;Wiki Editor&quot;, fr: &quot;Éditeur wiki&quot;, description: { en: &quot;First wiki edit&quot;, fr: &quot;Première modification d’un wiki&quot; }, long: { en: &quot;Edit a wiki post for the first time. Wiki posts let members work together on shared community information.&quot;, fr: &quot;Modifiez un message wiki pour la première fois. Les wikis permettent aux membres de contribuer ensemble aux informations de la communauté.&quot; } },
    { id: &quot;reader&quot;, group: &quot;getting-started&quot;, tier: &quot;bronze&quot;, icon: &quot;book-open&quot;, count: 160, earned: true, en: &quot;Reader&quot;, fr: &quot;Lecteur&quot;, description: { en: &quot;Read every reply in a topic with more than 100 replies&quot;, fr: &quot;A lu tous les messages d’un sujet contenant plus de 100 messages&quot; }, long: { en: &quot;This badge is granted the first time you read a long topic with more than 100 replies. Reading a conversation closely helps you follow the discussion, understand different viewpoints, and take part in more interesting conversations.&quot;, fr: &quot;Ce badge est décerné la première fois que vous lisez l’intégralité d’un long sujet contenant plus de 100 messages. Lire attentivement permet de suivre la discussion, de comprendre différents points de vue et de participer à des échanges plus intéressants.&quot; } },
    { id: &quot;new-user-month&quot;, group: &quot;getting-started&quot;, tier: &quot;bronze&quot;, icon: &quot;medal&quot;, count: 58, earned: true, en: &quot;New User of the Month&quot;, fr: &quot;Nouvel utilisateur du mois&quot;, description: { en: &quot;Outstanding contributions in your first month&quot;, fr: &quot;Contributions remarquables durant le premier mois&quot; }, long: { en: &quot;This badge recognizes excellent contributions by new members during their first month in the community.&quot;, fr: &quot;Ce badge récompense les contributions remarquables des nouveaux membres au cours de leur premier mois dans la communauté.&quot; } },
    { id: &quot;enthusiast&quot;, group: &quot;community&quot;, tier: &quot;bronze&quot;, icon: &quot;calendar-check&quot;, count: 128, earned: true, en: &quot;Enthusiast&quot;, fr: &quot;Enthousiaste&quot;, description: { en: &quot;Visited 10 consecutive days&quot;, fr: &quot;A visité le site 10 jours consécutifs&quot; }, long: { en: &quot;Visit the community on 10 consecutive days. Return regularly to read and take part in the conversations.&quot;, fr: &quot;Visitez la communauté pendant 10 jours consécutifs. Revenez régulièrement lire les discussions et y participer.&quot; } },
    { id: &quot;aficionado&quot;, group: &quot;community&quot;, tier: &quot;silver&quot;, icon: &quot;calendar-check&quot;, count: 46, earned: true, en: &quot;Aficionado&quot;, fr: &quot;Aficionado&quot;, description: { en: &quot;Visited 100 consecutive days&quot;, fr: &quot;A visité le site 100 jours consécutifs&quot; }, long: { en: &quot;Visit the community on 100 consecutive days. Your regular presence helps keep the conversation going.&quot;, fr: &quot;Visitez la communauté pendant 100 jours consécutifs. Votre présence régulière fait vivre les discussions.&quot; } },
    { id: &quot;devotee&quot;, group: &quot;community&quot;, tier: &quot;gold&quot;, icon: &quot;calendar-check&quot;, count: 12, earned: false, en: &quot;Devotee&quot;, fr: &quot;Dévoué&quot;, description: { en: &quot;Visited 365 consecutive days&quot;, fr: &quot;A visité le site 365 jours consécutifs&quot; }, long: { en: &quot;Visit the community on 365 consecutive days. An entire year of showing up for your community.&quot;, fr: &quot;Visitez la communauté pendant 365 jours consécutifs. Une année entière de présence auprès des autres membres.&quot; } },
    { id: &quot;nice-reply&quot;, group: &quot;posting&quot;, tier: &quot;bronze&quot;, icon: &quot;thumbs-up&quot;, count: 820, earned: true, repeat: true, en: &quot;Nice Reply&quot;, fr: &quot;Belle réponse&quot;, description: { en: &quot;Received 10 likes on a reply&quot;, fr: &quot;A reçu 10 « J’aime » pour une réponse&quot; }, long: { en: &quot;Receive 10 likes on a reply. Your contribution made an impression and helped move the conversation forward.&quot;, fr: &quot;Recevez 10 « J’aime » pour une réponse. Votre contribution a marqué les esprits et fait avancer la conversation.&quot; } },
    { id: &quot;good-reply&quot;, group: &quot;posting&quot;, tier: &quot;silver&quot;, icon: &quot;thumbs-up&quot;, count: 174, earned: true, repeat: true, en: &quot;Good Reply&quot;, fr: &quot;Bonne réponse&quot;, description: { en: &quot;Received 25 likes on a reply&quot;, fr: &quot;A reçu 25 « J’aime » pour une réponse&quot; }, long: { en: &quot;Receive 25 likes on a reply. Your contribution made the conversation much more interesting.&quot;, fr: &quot;Recevez 25 « J’aime » pour une réponse. Votre contribution a rendu la conversation encore plus intéressante.&quot; } },
    { id: &quot;great-reply&quot;, group: &quot;posting&quot;, tier: &quot;gold&quot;, icon: &quot;thumbs-up&quot;, count: 28, earned: false, repeat: true, en: &quot;Great Reply&quot;, fr: &quot;Excellente réponse&quot;, description: { en: &quot;Received 50 likes on a reply&quot;, fr: &quot;A reçu 50 « J’aime » pour une réponse&quot; }, long: { en: &quot;Receive 50 likes on a reply. The community loved your inspiring, insightful, or entertaining contribution.&quot;, fr: &quot;Recevez 50 « J’aime » pour une réponse. La communauté a apprécié votre contribution inspirante, pertinente ou amusante.&quot; } },
    { id: &quot;basic&quot;, group: &quot;trust-level&quot;, tier: &quot;bronze&quot;, icon: &quot;user&quot;, count: 245, earned: true, en: &quot;Basic&quot;, fr: &quot;Utilisateur de base&quot;, description: { en: &quot;Granted all essential community functions&quot;, fr: &quot;A accès aux fonctions essentielles de la communauté&quot; }, long: { en: &quot;Reach trust level 1 by spending time reading community topics. New user restrictions are lifted.&quot;, fr: &quot;Atteignez le niveau de confiance 1 en lisant les sujets de la communauté. Les restrictions des nouveaux utilisateurs sont levées.&quot; } },
    { id: &quot;member&quot;, group: &quot;trust-level&quot;, tier: &quot;bronze&quot;, icon: &quot;user&quot;, count: 187, earned: true, en: &quot;Member&quot;, fr: &quot;Membre&quot;, description: { en: &quot;Granted invitations, group messaging, more likes&quot;, fr: &quot;Peut inviter, envoyer des messages de groupe et donner plus de « J’aime »&quot; }, long: { en: &quot;Reach trust level 2 through sustained participation over a period of weeks.&quot;, fr: &quot;Atteignez le niveau de confiance 2 en participant régulièrement pendant plusieurs semaines.&quot; } },
    { id: &quot;regular&quot;, group: &quot;trust-level&quot;, tier: &quot;silver&quot;, icon: &quot;user&quot;, count: 42, earned: true, title: true, en: &quot;Regular&quot;, fr: &quot;Habitué&quot;, description: { en: &quot;Granted recategorize, rename, followed links, wiki, more likes&quot;, fr: &quot;Peut reclasser et renommer les sujets, créer des wikis et donner plus de « J’aime »&quot; }, long: { en: &quot;Reach trust level 3 by being an active, reliable reader and contributor over a period of months.&quot;, fr: &quot;Atteignez le niveau de confiance 3 en étant un lecteur actif et un contributeur régulier pendant plusieurs mois.&quot; } },
    { id: &quot;leader&quot;, group: &quot;trust-level&quot;, tier: &quot;gold&quot;, icon: &quot;user&quot;, count: 8, earned: false, title: true, en: &quot;Leader&quot;, fr: &quot;Meneur&quot;, description: { en: &quot;Granted global edit, pin, close, archive, split and merge, more likes&quot;, fr: &quot;Peut modifier, épingler, fermer, archiver, scinder et fusionner les sujets&quot; }, long: { en: &quot;Reach trust level 4 when selected by staff as a community leader who sets a positive example.&quot;, fr: &quot;Atteignez le niveau de confiance 4 lorsque l’équipe vous choisit comme membre exemplaire de la communauté.&quot; } }
  ];
  const tierOrder = { bronze: 0, silver: 1, gold: 2 };
  const escape = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, char =&gt; ({ &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot; })[char]);
  const icon = name =&gt; `&lt;i class=&quot;dn-icon&quot; data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const c = () =&gt; copy[state.language];
  const name = badge =&gt; badge[state.language];
  const number = value =&gt; new Intl.NumberFormat(state.language).format(value);
  const awarded = badge =&gt; `${number(badge.count)} ${c().awarded}`;
  const symbol = (badge, extra = &quot;&quot;) =&gt; `&lt;span class=&quot;dn-badge-symbol ${extra}&quot;&gt;${icon(badge.icon)}&lt;/span&gt;`;
  const tier = badge =&gt; `&lt;span class=&quot;dn-tier&quot;&gt;${c()[badge.tier]}&lt;/span&gt;`;
  const earned = badge =&gt; badge.earned ? `&lt;span class=&quot;dn-earned-mark&quot; aria-label=&quot;${escape(c().haveBadge)}&quot;&gt;${icon(&quot;check&quot;)}&lt;/span&gt;` : &quot;&quot;;
  const sorted = group =&gt; badges.filter(badge =&gt; badge.group === group.id).sort((a, b) =&gt; tierOrder[a.tier] - tierOrder[b.tier] || name(a).localeCompare(name(b), state.language));
  const label = badge =&gt; escape(`${name(badge)}. ${c()[badge.tier]}. ${badge.description[state.language]}. ${awarded(badge)}. ${badge.earned ? c().haveBadge : c().noBadge}`);

  function navRow(labelText, iconName, active = false, count = &quot;&quot;) {
    return `&lt;div class=&quot;dn-nav-row ${active ? &quot;dn-nav-row--active&quot; : &quot;&quot;}&quot; ${active ? &#x27;aria-current=&quot;page&quot;&#x27; : &quot;&quot;}&gt;${icon(iconName)}&lt;span&gt;${labelText}&lt;/span&gt;${count ? `&lt;span class=&quot;dn-nav-count&quot;&gt;${count}&lt;/span&gt;` : &quot;&quot;}&lt;/div&gt;`;
  }
  function navigation() {

      &lt;div class=&quot;dn-sidebar-label&quot;&gt;${icon(&quot;chevron-down&quot;)}${c().categories}&lt;/div&gt;

  }
  function card(badge) {
    return `&lt;button type=&quot;button&quot; class=&quot;dn-badge-card&quot; data-badge=&quot;${badge.id}&quot; data-tier=&quot;${badge.tier}&quot; aria-label=&quot;${label(badge)}&quot;&gt;

  function row(badge, compact = false) {
    return `&lt;button type=&quot;button&quot; class=&quot;dn-badge-row&quot; data-badge=&quot;${badge.id}&quot; data-tier=&quot;${badge.tier}&quot; aria-label=&quot;${label(badge)}&quot; ${compact ? `aria-pressed=&quot;${badge.id === selectedId}&quot;` : &quot;&quot;}&gt;

      &lt;span class=&quot;${compact ? &quot;dn-awarded&quot; : &quot;dn-badge-description&quot;}&quot;&gt;${compact ? awarded(badge) : escape(badge.description[state.language])}&lt;/span&gt;&lt;/span&gt;
      ${compact ? &quot;&quot; : `&lt;span class=&quot;dn-row-meta&quot;&gt;${tier(badge)}&lt;span class=&quot;dn-awarded&quot;&gt;${awarded(badge)}&lt;/span&gt;&lt;/span&gt;`}
      ${badge.earned ? earned(badge) : `&lt;span class=&quot;dn-row-arrow&quot;&gt;${icon(&quot;chevron-right&quot;)}&lt;/span&gt;`}&lt;/button&gt;`;

    return groups.map(group =&gt; `&lt;section class=&quot;dn-group&quot; aria-labelledby=&quot;dn-group-${group.id}&quot;&gt;&lt;div class=&quot;dn-group-title&quot;&gt;&lt;h2 id=&quot;dn-group-${group.id}&quot;&gt;${group[state.language]}&lt;/h2&gt;&lt;span&gt;${sorted(group).length}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;${mode === &quot;cards&quot; ? &quot;dn-badge-grid&quot; : &quot;dn-badge-list&quot;}&quot;&gt;${sorted(group).map(badge =&gt; mode === &quot;cards&quot; ? card(badge) : row(badge, mode === &quot;split&quot;)).join(&quot;&quot;)}&lt;/div&gt;&lt;/section&gt;`).join(&quot;&quot;);
  }
  function backButton(extra = &quot;&quot;) { return `&lt;button type=&quot;button&quot; class=&quot;dn-back ${extra}&quot; data-back&gt;${icon(&quot;arrow-left&quot;)}${c().back}&lt;/button&gt;`; }

      &lt;p class=&quot;dn-detail-subtitle&quot;&gt;${escape(badge.description[state.language])}&lt;/p&gt;
      &lt;div class=&quot;dn-detail-earned ${badge.earned ? &quot;&quot; : &quot;dn-detail-earned--pending&quot;}&quot;&gt;${icon(badge.earned ? &quot;circle-check&quot; : &quot;circle&quot;)}${badge.earned ? c().haveBadge : c().noBadge}&lt;/div&gt;
      &lt;hr class=&quot;dn-detail-rule&quot;&gt;&lt;h3&gt;${c().how}&lt;/h3&gt;&lt;p class=&quot;dn-detail-long&quot;&gt;${escape(badge.long[state.language])}&lt;/p&gt;
      &lt;hr class=&quot;dn-detail-rule&quot;&gt;&lt;div class=&quot;dn-detail-facts&quot;&gt;&lt;span&gt;${icon(&quot;users&quot;)}${awarded(badge)}&lt;/span&gt;&lt;span&gt;${icon(badge.repeat ? &quot;repeat-2&quot; : &quot;award&quot;)}${badge.repeat ? c().repeat : c().once}&lt;/span&gt;${badge.title ? `&lt;span&gt;${icon(&quot;type&quot;)}${c().title}&lt;/span&gt;` : &quot;&quot;}&lt;/div&gt;
      &lt;/article&gt;`;
  }
  function content() {
    const badge = badges.find(item =&gt; item.id === selectedId);
    if (state.layout === &quot;split&quot;) return `&lt;div class=&quot;dn-explorer ${detailOpen ? &quot;dn-explorer--detail&quot; : &quot;&quot;}&quot;&gt;&lt;div class=&quot;dn-explorer-list&quot;&gt;${groupList(&quot;split&quot;)}&lt;/div&gt;&lt;aside class=&quot;dn-detail-lane&quot; aria-label=&quot;${escape(name(badge))}&quot;&gt;${backButton(&quot;dn-detail-mobile-back&quot;)}${detail(badge)}&lt;/aside&gt;&lt;/div&gt;`;
    if (detailOpen) return `&lt;div class=&quot;dn-detail-full&quot;&gt;${backButton()}${detail(badge)}&lt;/div&gt;`;
    return `&lt;div class=&quot;dn-page&quot;&gt;${groupList(state.layout)}&lt;/div&gt;`;
  }
  function refreshIcons() { globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } }); }
  function render() {
    root.dataset.appearance = state.appearance;
    root.dataset.viewport = state.viewport;
    root.lang = state.language;
    root.querySelector(&quot;[data-study-title]&quot;).textContent = layoutNames[state.layout];
    root.querySelectorAll(&quot;[data-control]&quot;).forEach(control =&gt; { control.value = state[control.dataset.control]; });
    product.innerHTML = `&lt;div class=&quot;dn-window&quot;&gt;
      &lt;aside class=&quot;dn-rail&quot; aria-label=&quot;Sites&quot;&gt;&lt;div class=&quot;dn-rail-mark&quot;&gt;${icon(&quot;panels-top-left&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-rail-separator&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dn-rail-mark dn-rail-mark--selected&quot;&gt;${icon(&quot;messages-square&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-rail-mark&quot;&gt;${icon(&quot;code-xml&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-rail-mark&quot;&gt;${icon(&quot;plus&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-rail-spacer&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dn-rail-mark&quot;&gt;${icon(&quot;settings&quot;)}&lt;/div&gt;&lt;/aside&gt;
      &lt;aside class=&quot;dn-sidebar&quot; aria-label=&quot;${c().community}&quot;&gt;&lt;div class=&quot;dn-forum&quot;&gt;Discourse ${icon(&quot;chevron-down&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-sidebar-content&quot;&gt;${navigation()}&lt;/div&gt;&lt;/aside&gt;
      &lt;main class=&quot;dn-main&quot;&gt;&lt;div class=&quot;dn-tabs&quot;&gt;&lt;div class=&quot;dn-tab&quot;&gt;${icon(&quot;messages-square&quot;)}${c().topics}${icon(&quot;x&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-tab dn-tab--active&quot;&gt;${icon(&quot;award&quot;)}${c().badges}${icon(&quot;x&quot;)}&lt;/div&gt;&lt;div class=&quot;dn-tab-add&quot;&gt;${icon(&quot;plus&quot;)}&lt;/div&gt;&lt;/div&gt;
      &lt;header class=&quot;dn-header&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;dn-mobile-menu&quot; data-menu aria-label=&quot;${c().menu}&quot; aria-expanded=&quot;${mobileNavigationOpen}&quot;&gt;${icon(&quot;menu&quot;)}&lt;/button&gt;${icon(&quot;award&quot;)}&lt;h1&gt;${c().badges}&lt;/h1&gt;&lt;span class=&quot;dn-header-count&quot;&gt;${badges.length}&lt;/span&gt;&lt;span class=&quot;dn-header-status&quot;&gt;${icon(&quot;circle-check&quot;)}${badges.filter(item =&gt; item.earned).length} ${c().earned}&lt;/span&gt;&lt;/header&gt;
      &lt;div class=&quot;dn-mobile-navigation&quot; ${mobileNavigationOpen ? &quot;&quot; : &quot;hidden&quot;}&gt;${navigation()}&lt;/div&gt;&lt;div data-content&gt;${content()}&lt;/div&gt;&lt;/main&gt;&lt;/div&gt;`;
    refreshIcons();

  root.addEventListener(&quot;click&quot;, event =&gt; {
    const clicked = event.target.closest(&quot;button&quot;);
    if (!clicked || !root.contains(clicked)) return;
    if (clicked.hasAttribute(&quot;data-menu&quot;)) { mobileNavigationOpen = !mobileNavigationOpen; render(); root.querySelector(&quot;[data-menu]&quot;)?.focus({ preventScroll: true }); return; }
    const isBack = clicked.hasAttribute(&quot;data-back&quot;);
    if (!isBack &amp;&amp; !clicked.dataset.badge) return;
    if (!isBack) selectedId = clicked.dataset.badge;
    detailOpen = !isBack;
    product.querySelector(&quot;[data-content]&quot;).innerHTML = content();
    refreshIcons();
    const selected = badges.find(badge =&gt; badge.id === selectedId);
    root.querySelector(&quot;[data-announcement]&quot;).textContent = isBack ? c().back : `${name(selected)}. ${selected.description[state.language]}`;
    if (isBack) root.querySelector(`[data-badge=&quot;${selectedId}&quot;]`)?.focus({ preventScroll: true });
    else if (state.layout === &quot;split&quot; &amp;&amp; product.querySelector(&quot;.dn-main&quot;).clientWidth &gt; 620) root.querySelector(`[data-badge=&quot;${selectedId}&quot;]`)?.focus({ preventScroll: true });
    else product.querySelector(&quot;[data-back]&quot;)?.focus({ preventScroll: true });
  });
  root.querySelectorAll(&quot;[data-control]&quot;).forEach(control =&gt; control.addEventListener(&quot;change&quot;, () =&gt; {
    state[control.dataset.control] = control.value;
    if (control.dataset.control === &quot;layout&quot;) detailOpen = false;
    render();
  }));
  render();
  if (globalThis.Tweak) {
    let previousLayout = state.layout;
    const tweak = new Tweak({ container: root, onChange: () =&gt; { if (previousLayout !== state.layout) detailOpen = false; previousLayout = state.layout; render(); } });
    tweak.addSelect(state, &quot;layout&quot;, { label: &quot;Layout&quot;, options: Object.entries(layoutNames).map(([value, label]) =&gt; ({ value, label })) });
    tweak.addSelect(state, &quot;appearance&quot;, { label: &quot;Theme&quot;, options: [{ value: &quot;dark&quot;, label: &quot;Dark&quot; }, { value: &quot;light&quot;, label: &quot;Light&quot; }, { value: &quot;system&quot;, label: &quot;System&quot; }] });
    tweak.addSelect(state, &quot;language&quot;, { label: &quot;Language&quot;, options: [{ value: &quot;fr&quot;, label: &quot;Français&quot; }, { value: &quot;en&quot;, label: &quot;English&quot; }] });
    tweak.addSelect(state, &quot;viewport&quot;, { label: &quot;Preview width&quot;, options: [{ value: &quot;desktop&quot;, label: &quot;Desktop&quot; }, { value: &quot;phone&quot;, label: &quot;Phone&quot; }] });
  } else root.querySelector(&quot;.dn-study-toolbar&quot;).hidden = false;
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();

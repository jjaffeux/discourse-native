name: libavif
description: Native AVIF decoding for Dart, built from libavif source with native assets.
version: 0.1.1
repository: https://github.com/dartgfx/libavif
topics:
  - avif
  - image

environment:
  sdk: ^3.12.0

dependencies:
  code_assets: '>=1.0.0 <2.0.0'
  ffi: ^2.2.0
  hooks: '>=1.0.2 <3.0.0'
  native_toolchain_rust: '>=1.0.4 <2.0.0'

dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: '>=1.28.0 <2.0.0'

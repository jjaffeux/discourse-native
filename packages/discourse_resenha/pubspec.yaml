name: discourse_resenha
description: Native iOS bridge for the bundled Discourse Resenha integration.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        pluginClass: DiscourseResenhaPlugin
